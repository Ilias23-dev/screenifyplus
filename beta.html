<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Redirects to the official site after 5 seconds -->
    <meta http-equiv="refresh" content="5; url=https://screenifyplus.online">
    <title>Beta Ended - Screenify+</title>
    <link rel="icon" href="https://i.ibb.co/ycxg0PG2/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0A;
            color: #FFFFFF;
            overflow: hidden;
        }
        .glow-red {
            box-shadow: 0 0 30px rgba(229,9,20,0.5), 0 0 80px rgba(229,9,20,0.2), 0 0 120px rgba(229,9,20,0.1);
        }
        .text-glow {
            text-shadow: 0 0 40px rgba(229,9,20,0.5), 0 0 80px rgba(229,9,20,0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #E50914, #B8070F);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(229,9,20,0.4);
        }
    </style>
</head>
<body>

    <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
        
        <!-- Background Glow -->
        <div class="absolute inset-0 pointer-events-none">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full" style="background: radial-gradient(circle, rgba(229,9,20,0.15) 0%, transparent 70%); filter: blur(80px);"></div>
        </div>

        <!-- Content Card -->
        <div class="relative z-10 text-center max-w-lg w-full bg-[#111111] border border-white/5 rounded-3xl p-8 sm:p-12 glow-red">
            
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <img src="https://i.ibb.co/ycxg0PG2/logo.png" alt="Screenify+" class="w-20 h-20 rounded-2xl">
            </div>

            <!-- Icon -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-500/10 border border-red-500/20 mb-6">
                <i data-lucide="shield-alert" class="w-8 h-8 text-red-500"></i>
            </div>

            <!-- Heading -->
            <h1 class="text-3xl sm:text-4xl font-black mb-4 text-glow">Beta Phase Ended</h1>
            
            <!-- Description -->
            <p class="text-gray-400 text-base sm:text-lg mb-2 leading-relaxed">
                Thank you for testing the Screenify+ Beta!
            </p>
            <p class="text-gray-500 text-sm sm:text-base mb-8 leading-relaxed">
                The beta version is no longer available. Please download the official stable version from our website.
            </p>

            <!-- Redirect Button -->
            <a href="https://screenifyplus.online" class="btn-primary text-white font-bold py-4 px-8 rounded-2xl inline-flex items-center gap-2 mb-6">
                <i data-lucide="external-link" class="w-5 h-5"></i>
                Go to Official Website
            </a>

            <!-- Auto Redirect Notice -->
            <div class="flex items-center justify-center gap-2 text-gray-600 text-xs">
                <i data-lucide="loader-circle" class="w-4 h-4 animate-spin"></i>
                <span>Redirecting automatically in 5 seconds...</span>
            </div>

        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Fallback JavaScript redirect
        setTimeout(() => {
            window.location.href = "https://screenifyplus.online";
        }, 5000);
    </script>
</body>
</html>
