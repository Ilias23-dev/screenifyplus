<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenify+ Channel Extractor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --red: #ff0033; 
            --red-dim: #cc0029; 
            --bg: #050505; 
            --card: #0f0f0f; 
            --muted: #888888; 
            --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Cairo', sans-serif; 
            min-height: 100vh;
            background-image: radial-gradient(circle at 100% 0%, rgba(255, 0, 51, 0.08) 0%, transparent 25%),
                              radial-gradient(circle at 0% 100%, rgba(255, 0, 51, 0.05) 0%, transparent 25%);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--red-dim); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--red); }

        /* --- Login View --- */
        .login-view {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255, 0, 51, 0.05);
            text-align: center;
        }
        .login-logo {
            width: 80px; height: 80px; object-fit: contain; margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(255, 0, 51, 0.4));
        }
        .login-card h1 {
            font-size: 28px; font-weight: 900; margin-bottom: 5px;
            background: linear-gradient(135deg, #fff 0%, #ff0033 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-card p { color: var(--muted); margin-bottom: 30px; font-size: 14px; }
        
        .mode-switch {
            display: flex; background: rgba(255,255,255,0.05); border-radius: 12px;
            padding: 4px; margin-bottom: 25px; border: 1px solid var(--border);
        }
        .mode-btn {
            flex: 1; padding: 10px; background: transparent; border: none; color: #888;
            font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 14px;
            cursor: pointer; border-radius: 8px; transition: all 0.3s;
        }
        .mode-btn.active { background: var(--red); color: #fff; box-shadow: 0 4px 10px rgba(255, 0, 51, 0.3); }

        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; color: #ccc; font-size: 13px; font-weight: 600; }
        .input-group input {
            width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--border); border-radius: 10px; color: #fff;
            font-size: 14px; font-family: 'Cairo', sans-serif; transition: all 0.3s;
        }
        .input-group input:focus {
            outline: none; border-color: var(--red); background: rgba(0,0,0,0.6);
            box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.1);
        }

        .connect-btn {
            width: 100%; padding: 16px; margin-top: 10px;
            background: linear-gradient(135deg, var(--red) 0%, var(--red-dim) 100%);
            border: none; border-radius: 12px; color: #fff;
            font-size: 16px; font-weight: 800; font-family: 'Cairo', sans-serif;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 8px 20px rgba(255, 0, 51, 0.3);
        }
        .connect-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(255, 0, 51, 0.4); }

        /* --- App View --- */
        .app-view { display: none; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 15px 25px; margin-bottom: 25px;
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }
        .top-bar-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
        .top-bar-logo img { width: 32px; height: 32px; }
        
        .stats-container { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-box {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 16px; text-align: center; min-width: 110px;
        }
        .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; }
        .stat-value { font-size: 15px; color: #fff; font-weight: 800; margin-top: 2px; font-family: sans-serif; }
        .stat-value.active { color: var(--red); }
        .stat-value.unlimited { color: #2ecc71; }
        
        .disconnect-btn {
            background: transparent; border: 1px solid var(--red); color: var(--red);
            padding: 8px 16px; border-radius: 8px; font-family: 'Cairo', sans-serif;
            font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 13px;
        }
        .disconnect-btn:hover { background: var(--red); color: #fff; }

        /* Tabs */
        .tabs { display: flex; gap: 6px; margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 6px; border-radius: 14px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #888; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 10px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab-btn.active { background: linear-gradient(135deg, var(--red) 0%, var(--red-dim) 100%); color: #fff; box-shadow: 0 4px 15px rgba(255, 0, 51, 0.3); }
        .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.05); color: #fff; }

        /* Search */
        .search-wrap { margin-bottom: 20px; }
        .search-box { background: var(--card); border: 1px solid var(--border); border-radius: 50px; padding: 12px 20px; display: flex; align-items: center; gap: 12px; transition: all 0.3s; }
        .search-box:focus-within { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.1); }
        .search-box input { background: none; border: none; color: #fff; width: 100%; outline: none; font-size: 14px; font-family: 'Cairo', sans-serif; }
        .search-box i { color: var(--red); font-size: 16px; }

        /* Content */
        .channels-view { display: none; }
        .cat-header { background: linear-gradient(135deg, rgba(255, 0, 51, 0.05) 0%, transparent 100%); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .cat-header:hover { background: rgba(255, 0, 51, 0.1); border-color: rgba(255, 0, 51, 0.3); }
        .cat-name { font-weight: 800; font-size: 15px; color: #fff; }
        .cat-count { background: var(--red); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .cat-export-btn { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .cat-export-btn:hover { background: var(--red); color: #fff; }
        
        .channels-list { display: none; padding: 8px 0; }
        .channels-list.open { display: block; animation: fadeIn 0.3s ease; }
        .channel-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: rgba(255,255,255,0.02); border-radius: 10px; margin-bottom: 6px; border: 1px solid transparent; transition: 0.2s; }
        .channel-row:hover { background: rgba(255,255,255,0.05); border-color: rgba(255, 0, 51, 0.2); transform: translateX(-5px); }
        .channel-logo { width: 40px; height: 40px; object-fit: contain; border-radius: 6px; background: #000; padding: 2px; }
        .channel-name { flex: 1; font-size: 14px; font-weight: 600; color: #eee; }
        .copy-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: var(--red); }

        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        @media (min-width: 600px) { .content-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 900px) { .content-grid { grid-template-columns: repeat(5, 1fr); } }
        .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: all 0.3s; position: relative; }
        .item-card:hover { transform: translateY(-5px); border-color: var(--red); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .item-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #000; }
        .item-card .item-title { padding: 10px; text-align: center; font-size: 12px; font-weight: 700; color: #eee; min-height: 45px; display: flex; align-items: center; justify-content: center; }
        .item-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); color: var(--red); border: 1px solid var(--red); padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; }

        .no-results { text-align: center; padding: 40px; color: #888; font-weight: 700; background: var(--card); border-radius: 14px; border: 1px dashed var(--border); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .no-results button { background: var(--red); color: #fff; border: none; padding: 8px 24px; border-radius: 8px; font-family: 'Cairo'; font-weight: 700; cursor: pointer; }
        
        #loadMoreBtn { display: none; margin: 25px auto; padding: 12px 40px; background: transparent; border: 2px solid var(--red); color: var(--red); border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        #loadMoreBtn:hover { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255, 0, 51, 0.4); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.3s ease; }
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; box-shadow: 0 0 40px rgba(255, 0, 51, 0.1); }
        .modal-close { position: absolute; top: 15px; left: 15px; background: rgba(255, 0, 51, 0.2); border: 1px solid var(--red); color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .modal-close:hover { background: var(--red); transform: rotate(90deg); }
        .modal-poster { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; margin-bottom: 15px; background: #000; }
        .modal-title { font-size: 20px; font-weight: 900; margin-bottom: 12px; text-align: center; }
        .modal-info { color: #aaa; font-size: 13px; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .modal-info span { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 5px 12px; border-radius: 6px; }
        .modal-plot { color: #bbb; font-size: 13px; margin-bottom: 15px; line-height: 1.6; text-align: center; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 10px; border-right: 3px solid var(--red); }
        .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .modal-actions button { flex: 1; min-width: 100px; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .play-btn { background: var(--red); color: #fff; }
        .play-btn:hover { background: var(--red-dim); }
        .download-btn { background: rgba(255,255,255,0.1); color: #fff; }
        .download-btn:hover { background: rgba(255,255,255,0.2); }
        .season-btn { background: rgba(255,255,255,0.05); color: #fff; padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; font-weight: 700; transition: 0.2s; }
        .season-btn.active { background: var(--red); border-color: var(--red); box-shadow: 0 4px 10px rgba(255, 0, 51, 0.3); }

        .episode-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 6px; }
        .episode-container:hover { border-color: rgba(255, 0, 51, 0.2); }
        .episode-actions { display: flex; gap: 6px; }
        .episode-actions button { padding: 6px 12px; font-size: 11px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--card); border: 1px solid var(--red); color: #fff; padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: 700; z-index: 99999; opacity: 0; transition: all 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,5,0.9); z-index: 9998; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 15px; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,0,51,0.2); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; }
        .loader-text { color: var(--red); font-weight: 700; font-size: 18px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<!-- Login View -->
<div id="loginView" class="login-view">
    <div class="login-card">
        <img src="https://screenifyplus.online/logo.png" alt="Screenify+" class="login-logo">
        <h1>Screenify+</h1>
        <p>Channel Extractor & IPTV Browser</p>
        
        <div class="mode-switch">
            <button class="mode-btn active" onclick="switchMode('xtream', event)">Xtream Codes</button>
            <button class="mode-btn" onclick="switchMode('m3u', event)">M3U Link</button>
        </div>

        <!-- Xtream Inputs -->
        <div id="xtreamForm">
            <div class="input-group">
                <label>🔗 رابط السيرفر</label>
                <input type="text" id="serverUrl" placeholder="http://example.com" dir="ltr">
            </div>
            <div class="input-group">
                <label>👤 اسم المستخدم</label>
                <input type="text" id="username" placeholder="Username" dir="ltr">
            </div>
            <div class="input-group">
                <label>🔒 كلمة المرور</label>
                <input type="password" id="password" placeholder="Password" dir="ltr">
            </div>
        </div>

        <!-- M3U Inputs -->
        <div id="m3uForm" style="display:none;">
            <div class="input-group">
                <label>🔗 رابط M3U</label>
                <input type="text" id="m3uUrl" placeholder="http://example.com/playlist.m3u" dir="ltr">
            </div>
        </div>

        <button class="connect-btn" onclick="connectServer()">
            <i class="fas fa-rocket"></i> بدء الاستخراج
        </button>
    </div>
</div>

<!-- App View -->
<div id="appView" class="app-view">
    <div class="top-bar">
        <div class="top-bar-logo">
            <img src="https://screenifyplus.online/logo.png" alt="Logo">
            Screenify+
        </div>
        
        <div class="stats-container" id="statsContainer">
            <div class="stat-box">
                <div class="stat-label">انتهاء الاشتراك</div>
                <div class="stat-value" id="expDate">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">الحد الأقصى</div>
                <div class="stat-value unlimited" id="maxConn">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">متصل الآن</div>
                <div class="stat-value active" id="activeConn">--</div>
            </div>
        </div>

        <button class="disconnect-btn" onclick="disconnect()">
            <i class="fas fa-sign-out-alt"></i> قطع الاتصال
        </button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-live" onclick="switchTab('live')"><i class="fas fa-broadcast-tower"></i> القنوات</button>
        <button class="tab-btn" id="tab-movies" onclick="switchTab('movies')"><i class="fas fa-film"></i> الأفلام</button>
        <button class="tab-btn" id="tab-series" onclick="switchTab('series')"><i class="fas fa-tv"></i> المسلسلات</button>
    </div>

    <div class="search-wrap">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث هنا..." oninput="smartSearch()">
        </div>
    </div>

    <div class="channels-view" id="channelsView"></div>
    <div class="content-grid" id="contentGrid" style="display:none;"></div>
    <button id="loadMoreBtn" onclick="loadMore()">+ عرض المزيد</button>
</div>

<div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="closeModal(event)"></div>
<div class="toast" id="toast"></div>
<div class="loader-overlay" id="loader"><div class="spinner"></div><div class="loader-text" id="loaderText">جاري التحليل...</div></div>

<script>
    let authType = 'xtream';
    let currentTab = 'live';
    let allLiveCategories = [], allLiveChannels = [];
    let allMovies = [], allSeries = [];
    let filteredContent = [], filteredCategories = [];
    let visibleCount = 30;
    let baseServer = '', user = '', pass = '', m3uLink = '';

    // Proxy Fetch
    async function fetchProxy(url, isJson = true) {
        const proxies = [
            u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
            u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
            u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
        ];
        
        // Try proxies first
        for (const make of proxies) {
            try {
                const res = await fetch(make(url), { signal: AbortSignal.timeout(20000) });
                if (res.ok) return isJson ? await res.json() : await res.text();
            } catch (e) {}
        }
        
        // Fallback to direct
        const res = await fetch(url, { signal: AbortSignal.timeout(20000) });
        return isJson ? res.json() : res.text();
    }

    function switchMode(mode, e) {
        authType = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById('xtreamForm').style.display = mode === 'xtream' ? 'block' : 'none';
        document.getElementById('m3uForm').style.display = mode === 'm3u' ? 'block' : 'none';
    }

    function showLoader(text) {
        document.getElementById('loaderText').innerText = text;
        document.getElementById('loader').style.display = 'flex';
    }
    function hideLoader() { document.getElementById('loader').style.display = 'none'; }

    async function connectServer() {
        if (authType === 'xtream') {
            baseServer = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
            user = document.getElementById('username').value.trim();
            pass = document.getElementById('password').value.trim();
            if (!baseServer || !user || !pass) return showToast('⚠️ الرجاء تعبئة جميع الحقول');
            
            showLoader('جاري التحقق من الحساب...');
            try {
                const info = await fetchProxy(`${baseServer}/player_api.php?username=${user}&password=${pass}`);
                if (!info.user_info || info.user_info.auth === 0) {
                    hideLoader();
                    return showToast('❌ معلومات الدخول غير صحيحة');
                }
                updateStats(info.user_info);
            } catch (e) {
                hideLoader();
                return showToast('❌ فشل الاتصال بالسيرفر');
            }
        } else {
            m3uLink = document.getElementById('m3uUrl').value.trim();
            if (!m3uLink) return showToast('⚠️ الرجاء إدخال رابط M3U');
            document.getElementById('statsContainer').style.display = 'none';
        }

        document.getElementById('loginView').style.display = 'none';
        document.getElementById('appView').style.display = 'block';
        showLoader('جاري جلب القنوات...');
        try {
            await fetchLiveContent();
            hideLoader();
        } catch (e) {
            hideLoader();
            showToast('❌ حدث خطأ أثناء جلب البيانات');
            renderChannelsView(); // Render to show retry button
        }
    }

    function updateStats(userInfo) {
        const exp = userInfo.exp_date ? new Date(userInfo.exp_date * 1000).toLocaleDateString('en-GB') : 'دائم';
        const max = userInfo.max_connections === 0 ? '∞' : userInfo.max_connections;
        const active = userInfo.active_connections || 0;
        
        document.getElementById('expDate').innerText = exp;
        document.getElementById('maxConn').innerText = max;
        document.getElementById('activeConn').innerText = active;
    }

    function disconnect() {
        location.reload();
    }

    // Data Fetching
    async function fetchLiveContent() {
        document.getElementById('channelsView').innerHTML = '';
        
        if (authType === 'xtream') {
            const api = `${baseServer}/player_api.php`;
            try {
                const [cats, streams] = await Promise.all([
                    fetchProxy(`${api}?username=${user}&password=${pass}&action=get_live_categories`),
                    fetchProxy(`${api}?username=${user}&password=${pass}&action=get_live_streams`)
                ]);
                
                allLiveChannels = (streams || []).map(ch => ({
                    ...ch, stream_url: `${baseServer}/live/${user}/${pass}/${ch.stream_id}.m3u8`
                }));

                // Fix: If categories list is empty but we have streams, synthesize categories from streams
                if (cats && cats.length > 0) {
                    allLiveCategories = cats;
                } else if (allLiveChannels.length > 0) {
                    const catMap = new Map();
                    allLiveChannels.forEach(ch => {
                        const cid = ch.category_id || 'uncategorized';
                        if (!catMap.has(cid)) {
                            catMap.set(cid, { category_id: cid, category_name: ch.category_name || 'غير مصنف' });
                        }
                    });
                    allLiveCategories = Array.from(catMap.values());
                } else {
                    allLiveCategories = [];
                }
            } catch(e) {
                console.error("Fetch failed:", e);
                allLiveCategories = [];
                allLiveChannels = [];
                throw e; // Trigger catch block in connectServer
            }
        } else {
            // M3U Parsing
            try {
                const text = await fetchProxy(m3uLink, false);
                if (!text || text.startsWith("<!DOCTYPE")) throw new Error("Invalid M3U");
                parseM3U(text);
            } catch(e) {
                allLiveCategories = [];
                allLiveChannels = [];
                throw e;
            }
        }
        filteredCategories = [...allLiveCategories];
        renderChannelsView();
    }

    function parseM3U(text) {
        const lines = text.split('\n');
        let currentItem = null;
        let groups = new Map();
        allLiveChannels = [];
        
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            
            if (line.startsWith('#EXTINF')) {
                currentItem = { name: '', logo: '', group: 'غير مصنف', url: '' };
                const nameMatch = line.match(/,(.*)$/);
                if (nameMatch) currentItem.name = nameMatch[1].trim();
                const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                if (logoMatch) currentItem.logo = logoMatch[1].trim();
                const groupMatch = line.match(/group-title="([^"]+)"/);
                if (groupMatch) currentItem.group = groupMatch[1].trim();
            } else if (line.startsWith('http') && currentItem) {
                currentItem.url = line;
                currentItem.category_id = currentItem.group;
                if (!groups.has(currentItem.group)) groups.set(currentItem.group, currentItem.group);
                allLiveChannels.push(currentItem);
            }
        }
        allLiveCategories = Array.from(groups.keys()).map(g => ({ category_id: g, category_name: g }));
    }

    async function fetchMoviesContent() {
        document.getElementById('contentGrid').innerHTML = '<div class="no-results">جاري التحميل...</div>';
        const api = `${baseServer}/player_api.php`;
        try {
            const [cats, movies] = await Promise.all([
                fetchProxy(`${api}?username=${user}&password=${pass}&action=get_vod_categories`),
                fetchProxy(`${api}?username=${user}&password=${pass}&action=get_vod_streams`)
            ]);
            const catMap = new Map();
            (cats || []).forEach(c => catMap.set(c.category_id, c.category_name));
            allMovies = (movies || []).map(m => ({
                id: m.stream_id, name: (m.name || '').trim(),
                cover: m.stream_icon || m.cover || '', cat: catMap.get(m.category_id) || 'غير مصنف',
                ext: m.container_extension || 'mp4', plot: m.plot || '', rating: m.rating || '', year: m.year || ''
            }));
            filteredContent = [...allMovies];
            renderContentGrid('movie');
        } catch {
            document.getElementById('contentGrid').innerHTML = `<div class="no-results">❌ فشل تحميل الأفلام<br><button onclick="fetchMoviesContent()">إعادة المحاولة</button></div>`;
        }
    }

    async function fetchSeriesContent() {
        document.getElementById('contentGrid').innerHTML = '<div class="no-results">جاري التحميل...</div>';
        const api = `${baseServer}/player_api.php`;
        try {
            const [cats, series] = await Promise.all([
                fetchProxy(`${api}?username=${user}&password=${pass}&action=get_series_categories`),
                fetchProxy(`${api}?username=${user}&password=${pass}&action=get_series`)
            ]);
            const catMap = new Map();
            (cats || []).forEach(c => catMap.set(c.category_id, c.category_name));
            allSeries = (series || []).map(s => ({
                id: s.series_id, name: (s.name || '').trim(),
                cover: s.cover || s.stream_icon || '', cat: catMap.get(s.category_id) || 'غير مصنف',
                plot: s.plot || '', rating: s.rating || '', year: s.year || ''
            }));
            filteredContent = [...allSeries];
            renderContentGrid('series');
        } catch {
            document.getElementById('contentGrid').innerHTML = `<div class="no-results">❌ فشل تحميل المسلسلات<br><button onclick="fetchSeriesContent()">إعادة المحاولة</button></div>`;
        }
    }

    // Rendering
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        
        document.getElementById('channelsView').style.display = 'none';
        document.getElementById('contentGrid').style.display = 'none';
        document.getElementById('loadMoreBtn').style.display = 'none';
        document.getElementById('searchInput').value = '';
        visibleCount = 30;

        if (tab === 'live') {
            renderChannelsView();
        } else {
            document.getElementById('contentGrid').style.display = 'grid';
            if ((tab === 'movies' && allMovies.length === 0) || (tab === 'series' && allSeries.length === 0)) {
                if (authType === 'xtream') {
                    tab === 'movies' ? fetchMoviesContent() : fetchSeriesContent();
                } else {
                    document.getElementById('contentGrid').innerHTML = '<div class="no-results">⚠️ ميزة الأفلام والمسلسلات متاحة فقط لحسابات Xtream</div>';
                }
            } else {
                renderContentGrid(tab === 'movies' ? 'movie' : 'series');
            }
        }
    }

    function renderChannelsView() {
        const view = document.getElementById('channelsView');
        view.style.display = 'block';
        const q = document.getElementById('searchInput').value.toLowerCase().trim();

        if (q) {
            const matched = allLiveChannels.filter(ch => (ch.name || '').toLowerCase().includes(q));
            if (!matched.length) { 
                view.innerHTML = '<div class="no-results">🔍 لا توجد نتائج</div>'; 
                return; 
            }
            view.innerHTML = matched.map(ch => `
                <div class="channel-row">
                    <img class="channel-logo" src="${ch.stream_icon || ch.logo || ''}" onerror="this.src='https://placehold.co/40x40/0a0a0a/ff0033?text=📺'">
                    <span class="channel-name">${escapeHtml(ch.name || 'قناة')}</span>
                    <button class="copy-btn" onclick="copyLink('${ch.stream_url || ch.url}')">📋 نسخ</button>
                </div>`).join('');
            return;
        }

        if (!allLiveCategories.length || !allLiveChannels.length) { 
            view.innerHTML = `<div class="no-results">
                <span>⚠️ لا توجد أقسام أو فشل التحميل بسبب بطء الشبكة</span>
                <button onclick="fetchLiveContent()">إعادة المحاولة</button>
            </div>`; 
            return; 
        }

        view.innerHTML = allLiveCategories.map(cat => {
            const channels = allLiveChannels.filter(ch => ch.category_id == cat.category_id);
            if(channels.length === 0) return '';
            return `
                <div class="cat-header" onclick="toggleCat('cat-${cat.category_id}')">
                    <span class="cat-name">📂 ${escapeHtml(cat.category_name)}</span>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <span class="cat-count">${channels.length} قناة</span>
                        <button class="cat-export-btn" onclick="event.stopPropagation();exportLiveCategory('${cat.category_id}')">⬇ M3U</button>
                    </div>
                </div>
                <div class="channels-list" id="cat-${cat.category_id}">
                    ${channels.map(ch => `
                        <div class="channel-row">
                            <img class="channel-logo" src="${ch.stream_icon || ch.logo || ''}" onerror="this.src='https://placehold.co/40x40/0a0a0a/ff0033?text=📺'">
                            <span class="channel-name">${escapeHtml(ch.name || 'قناة')}</span>
                            <button class="copy-btn" onclick="copyLink('${ch.stream_url || ch.url}')">📋 نسخ</button>
                        </div>`).join('')}
                </div>`;
        }).join('');
    }

    function toggleCat(id) {
        document.getElementById(id).classList.toggle('open');
    }

    function exportLiveCategory(catId) {
        const cat = allLiveCategories.find(c => c.category_id == catId);
        const list = allLiveChannels.filter(ch => ch.category_id == catId);
        if (!list.length) return;
        let m3u = "#EXTM3U\n";
        list.forEach(ch => {
            const n = ch.name || 'قناة', l = ch.stream_icon || ch.logo || '';
            m3u += `#EXTINF:-1 tvg-name="${escapeM3U(n)}" tvg-logo="${escapeM3U(l)}" group-title="${escapeM3U(cat.category_name)}",${escapeM3U(n)}\n${ch.stream_url || ch.url}\n`;
        });
        downloadFile(m3u, (cat.category_name || 'channels').replace(/[^a-z0-9\u0600-\u06FF]/gi, "_") + ".m3u", "application/x-mpegurl");
        showToast('✅ تم تصدير ' + list.length + ' قناة');
    }

    function renderContentGrid(type) {
        const grid = document.getElementById('contentGrid');
        if (!filteredContent.length) { grid.innerHTML = '<div class="no-results">🎬 لا يوجد محتوى</div>'; return; }
        grid.innerHTML = filteredContent.slice(0, visibleCount).map((item, idx) => `
            <div class="item-card" onclick="previewItem('${type}', ${idx})">
                <img src="${item.cover || 'https://placehold.co/200x300/0a0a0a/ff0033?text=' + encodeURIComponent(type === 'movie' ? '🎬' : '📺')}" loading="lazy" onerror="this.src='https://placehold.co/200x300/0a0a0a/ff0033?text=No+Image'">
                <div class="item-title">${escapeHtml(item.name)}</div>
                ${item.cat ? `<div class="item-badge">${escapeHtml(item.cat)}</div>` : ''}
            </div>`).join('');
        document.getElementById('loadMoreBtn').style.display = filteredContent.length > visibleCount ? 'block' : 'none';
    }

    function smartSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        if (currentTab === 'live') { renderChannelsView(); return; }
        if (currentTab === 'movies') filteredContent = q ? allMovies.filter(i => i.name.toLowerCase().includes(q)) : [...allMovies];
        else filteredContent = q ? allSeries.filter(i => i.name.toLowerCase().includes(q)) : [...allSeries];
        visibleCount = 30;
        renderContentGrid(currentTab === 'movies' ? 'movie' : 'series');
    }

    function loadMore() {
        visibleCount += 30;
        renderContentGrid(currentTab === 'movies' ? 'movie' : 'series');
    }

    async function previewItem(type, idx) {
        const item = filteredContent[idx];
        if (!item) return;
        showLoader('جاري جلب التفاصيل...');
        try {
            if (type === 'movie') showMoviePreview(item);
            else await showSeriesPreview(item);
        } catch(e) {
            showToast('❌ خطأ في التحميل');
        }
        hideLoader();
    }

    function showMoviePreview(movie) {
        const url = `${baseServer}/movie/${user}/${pass}/${movie.id}.${movie.ext}`;
        const overlay = document.getElementById('modalOverlay');
        overlay.innerHTML = `
            <div class="modal-content" onclick="event.stopPropagation()">
                <button class="modal-close" onclick="closeModalDirect()"><i class="fas fa-times"></i></button>
                <img src="${movie.cover || 'https://placehold.co/400x300/0a0a0a/ff0033?text=🎬'}" class="modal-poster">
                <div class="modal-title">${escapeHtml(movie.name)}</div>
                <div class="modal-info">
                    ${movie.cat ? `<span>📂 ${escapeHtml(movie.cat)}</span>` : ''}
                    ${movie.year ? `<span>📅 ${escapeHtml(movie.year)}</span>` : ''}
                    ${movie.rating ? `<span>⭐ ${escapeHtml(movie.rating)}</span>` : ''}
                </div>
                ${movie.plot ? `<div class="modal-plot">📝 ${escapeHtml(movie.plot)}</div>` : ''}
                <div class="modal-actions">
                    <button class="play-btn" onclick="playMedia('${url}','${escapeHtml(movie.name).replace(/'/g,"\\'")}')">▶ تشغيل</button>
                    <button class="download-btn" onclick="downloadMedia('${url}','${escapeHtml(movie.name).replace(/'/g,"\\'")}')">⬇ تحميل</button>
                    <button class="download-btn" onclick="copyLink('${url}')">📋 نسخ</button>
                </div>
            </div>`;
        overlay.style.display = 'flex';
    }

    async function showSeriesPreview(series) {
        const api = `${baseServer}/player_api.php`;
        const info = await fetchProxy(`${api}?username=${user}&password=${pass}&action=get_series_info&series_id=${series.id}`);
        const episodes = info.episodes || {};
        const all = [];
        for (const [s, eps] of Object.entries(episodes)) (eps || []).forEach(ep => all.push({ ...ep, season: parseInt(s) }));
        all.sort((a, b) => a.season - b.season || a.episode_num - b.episode_num);
        const sMap = new Map();
        all.forEach(ep => { if (!sMap.has(ep.season)) sMap.set(ep.season, []); sMap.get(ep.season).push(ep); });
        const sKeys = Array.from(sMap.keys()).sort((a, b) => a - b);

        const overlay = document.getElementById('modalOverlay');
        let epsHtml = '';
        sKeys.forEach((s, idx) => {
            epsHtml += `<div id="season-${s}" style="display:${idx===0?'block':'none'};">
                ${sMap.get(s).map(ep => {
                    const eu = `${baseServer}/series/${user}/${pass}/${ep.id}.${ep.container_extension || 'mp4'}`;
                    return `<div class="episode-container">
                        <div><span style="font-weight:700;">🎬 حلقة ${ep.episode_num||'?'}</span><br><span style="font-size:10px;color:#888;">الموسم ${s}</span></div>
                        <div class="episode-actions">
                            <button class="play-btn" onclick="playMedia('${eu}','${escapeHtml(series.name).replace(/'/g,"\\'")} - حلقة ${ep.episode_num||'?'}')">▶</button>
                            <button class="download-btn" onclick="downloadMedia('${eu}','${escapeHtml(series.name).replace(/'/g,"\\'")}_S${s}E${ep.episode_num||'?'}.${ep.container_extension||'mp4'}')">⬇</button>
                        </div>
                    </div>`;
                }).join('')}
            </div>`;
        });

        overlay.innerHTML = `<div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalDirect()"><i class="fas fa-times"></i></button>
            <img src="${series.cover||''}" class="modal-poster" onerror="this.src='https://placehold.co/400x300/0a0a0a/ff0033?text=Series'">
            <div class="modal-title">${escapeHtml(series.name)}</div>
            <div class="modal-info">${series.cat ? `<span>📂 ${escapeHtml(series.cat)}</span>` : ''} <span>📺 ${sKeys.length} مواسم</span></div>
            ${series.plot ? `<div class="modal-plot">📝 ${escapeHtml(series.plot)}</div>` : ''}
            <div style="display:flex; gap:8px; justify-content:center; margin-bottom:15px; flex-wrap:wrap;">
                ${sKeys.map((s, idx) => `<button class="season-btn ${idx===0?'active':''}" onclick="showEpisodes(${s},this)">الموسم ${s}</button>`).join('')}
            </div>
            ${epsHtml}
        </div>`;
        overlay.style.display = 'flex';
    }

    function showEpisodes(s, btn) {
        document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        document.querySelectorAll('[id^="season-"]').forEach(el => el.style.display = 'none');
        document.getElementById('season-' + s).style.display = 'block';
    }

    function closeModal(e) { if (e.target.id === 'modalOverlay') closeModalDirect(); }
    function closeModalDirect() { document.getElementById('modalOverlay').style.display = 'none'; }

    function playMedia(url, title) {
        const w = window.open('', '_blank', 'width=800,height=600');
        w.document.write(`<!DOCTYPE html><html><head><title>${title}</title><style>*{margin:0;padding:0}body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;}video{max-width:100%;max-height:80vh;}h3{color:#fff;margin-bottom:15px;font-family:sans-serif;}</style></head><body><h3>${title}</h3><video controls autoplay><source src="${url}">متصفحك لا يدعم التشغيل</video></body></html>`);
    }
    function downloadMedia(url, filename) { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
    function downloadFile(content, filename, mime) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type: mime })); a.download = filename; a.click(); }
    function copyLink(url) { navigator.clipboard.writeText(url).then(() => showToast('✅ تم نسخ الرابط')); }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    function escapeHtml(text) { if(!text) return ""; const d = document.createElement("div"); d.appendChild(document.createTextNode(text)); return d.innerHTML; }
    function escapeM3U(text) { return (text||'').replace(/#/g,'').replace(/,/g,'').replace(/\n/g,''); }
</script>
