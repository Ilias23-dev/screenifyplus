<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenify+ - محادثة ذكية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep: #07070b;
      --bg-primary: #0b0b11;
      --bg-secondary: #111118;
      --bg-tertiary: #18181f;
      --bg-hover: #1f1f28;
      --bg-active: #282833;
      --border: #232330;
      --border-light: #2e2e3d;
      --text-primary: #eaeaf0;
      --text-secondary: #8585a0;
      --text-muted: #55556a;
      --accent: #e53935;
      --accent-light: #ef5350;
      --accent-dark: #c62828;
      --accent-glow: rgba(229, 57, 53, 0.12);
      --accent-glow-md: rgba(229, 57, 53, 0.25);
      --user-bubble: rgba(229, 57, 53, 0.08);
      --user-bubble-border: rgba(229, 57, 53, 0.2);
      --bot-bubble: #111118;
      --bot-bubble-border: #232330;
      --code-bg: #09090d;
      --code-header: #0f0f16;
      --sidebar-w: 280px;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-xs: 7px;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      direction: rtl;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    /* === LAYOUT === */
    .app { display: flex; direction: ltr; height: 100vh; }
    .rtl { direction: rtl; }

    /* === SIDEBAR === */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--bg-primary);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    }
    .sidebar-head {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 11px; margin-bottom: 18px;
    }
    .sidebar-logo img {
      width: 36px; height: 36px; border-radius: 10px;
      box-shadow: 0 0 18px var(--accent-glow-md);
    }
    .sidebar-logo span {
      font-weight: 700; font-size: 18px; color: var(--text-primary);
      direction: rtl;
    }
    .sidebar-logo span em {
      font-style: normal; color: var(--accent);
    }
    .new-chat-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 11px; border-radius: var(--radius-sm);
      background: var(--accent-glow); border: 1px solid var(--user-bubble-border);
      color: var(--accent-light); font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .new-chat-btn:hover {
      background: var(--accent-glow-md); border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .new-chat-btn svg { width: 18px; height: 18px; }
    .chat-list {
      flex: 1; overflow-y: auto; padding: 10px 10px;
    }
    .chat-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      cursor: pointer; transition: all 0.15s; position: relative;
      margin-bottom: 2px;
    }
    .chat-item:hover { background: var(--bg-hover); }
    .chat-item.active {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
    }
    .chat-item:not(.active) { border: 1px solid transparent; }
    .chat-item-icon {
      width: 34px; height: 34px; min-width: 34px;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
    }
    .chat-item-info { flex: 1; overflow: hidden; direction: rtl; }
    .chat-item-title {
      font-size: 13px; font-weight: 500; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-item-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .chat-item-del {
      width: 28px; height: 28px; border-radius: 6px; border: none;
      background: transparent; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: all 0.15s;
    }
    .chat-item:hover .chat-item-del { opacity: 1; }
    .chat-item-del:hover { background: rgba(229,57,53,0.15); color: var(--accent); }
    .chat-item-del svg { width: 15px; height: 15px; }
    .sidebar-empty {
      text-align: center; padding: 40px 20px; color: var(--text-muted);
      font-size: 13px; direction: rtl;
    }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px); z-index: 99;
    }

    /* === MAIN === */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    .main-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--bg-primary); z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .menu-btn {
      display: none; width: 38px; height: 38px; border-radius: var(--radius-xs);
      border: 1px solid var(--border); background: var(--bg-secondary);
      color: var(--text-secondary); cursor: pointer;
      align-items: center; justify-content: center;
    }
    .menu-btn svg { width: 20px; height: 20px; }

    /* === MODEL DROPDOWN === */
    .model-dd { position: relative; }
    .model-dd-trigger {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg-secondary);
      color: var(--text-primary); font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .model-dd-trigger:hover { border-color: var(--border-light); background: var(--bg-tertiary); }
    .model-dd-icon {
      width: 26px; height: 26px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .model-dd-trigger .chevron {
      width: 16px; height: 16px; color: var(--text-muted); transition: transform 0.2s;
      flex-shrink: 0;
    }
    .model-dd.open .chevron { transform: rotate(180deg); }
    .model-dd-menu {
      position: absolute; top: calc(100% + 6px); right: 0;
      min-width: 260px; max-height: 320px; overflow-y: auto;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 6px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      opacity: 0; visibility: hidden; transform: translateY(-8px);
      transition: all 0.2s cubic-bezier(.4,0,.2,1);
      z-index: 200;
    }
    .model-dd.open .model-dd-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    .model-dd-option {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius-xs);
      cursor: pointer; transition: background 0.12s; font-size: 13px;
      color: var(--text-secondary); direction: rtl;
    }
    .model-dd-option:hover { background: var(--bg-hover); color: var(--text-primary); }
    .model-dd-option.active { background: var(--accent-glow); color: var(--accent-light); }
    .model-dd-option .opt-icon {
      width: 28px; height: 28px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .model-dd-option .opt-check { margin-right: auto; width: 16px; height: 16px; color: var(--accent); }

    /* === MESSAGES === */
    .messages-wrap {
      flex: 1; overflow-y: auto; padding: 24px 0;
      background: var(--bg-deep);
      background-image: radial-gradient(ellipse at 50% 0%, rgba(229,57,53,0.03) 0%, transparent 60%);
    }
    .messages-inner {
      max-width: 780px; margin: 0 auto; padding: 0 24px;
      display: flex; flex-direction: column; gap: 6px;
    }

    /* Welcome */
    .welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; text-align: center; padding: 40px 20px;
    }
    .welcome-logo {
      width: 72px; height: 72px; border-radius: 20px; margin-bottom: 22px;
      box-shadow: 0 0 40px var(--accent-glow-md), 0 0 80px var(--accent-glow);
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 40px var(--accent-glow-md), 0 0 80px var(--accent-glow); }
      50% { box-shadow: 0 0 50px var(--accent-glow-md), 0 0 100px rgba(229,57,53,0.18); }
    }
    .welcome h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .welcome h2 em { font-style: normal; color: var(--accent); }
    .welcome p { color: var(--text-secondary); font-size: 15px; margin-bottom: 36px; }
    .suggestions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      width: 100%; max-width: 520px;
    }
    .sug-card {
      padding: 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg-secondary);
      cursor: pointer; transition: all 0.2s; text-align: right;
      direction: rtl;
    }
    .sug-card:hover {
      border-color: var(--user-bubble-border); background: var(--bg-tertiary);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .sug-card-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--accent-glow); color: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px;
    }
    .sug-card-icon svg { width: 16px; height: 16px; }
    .sug-card-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

    /* Message */
    .msg { animation: msgIn 0.35s ease; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-row {
      display: flex; gap: 12px; padding: 12px 0;
      max-width: 88%;
    }
    .msg-row.user { margin-right: auto; margin-left: 0; flex-direction: row-reverse; }
    .msg-row.bot { margin-left: auto; margin-right: 0; }
    .msg-avatar {
      width: 32px; height: 32px; min-width: 32px;
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #fff; margin-top: 2px;
    }
    .msg-row.user .msg-avatar { background: var(--accent); }
    .msg-bubble {
      padding: 14px 18px; border-radius: var(--radius);
      line-height: 1.75; font-size: 14.5px;
      position: relative;
    }
    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      border: 1px solid var(--user-bubble-border);
      border-top-right-radius: 4px;
    }
    .msg-row.bot .msg-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--bot-bubble-border);
      border-top-left-radius: 4px;
    }
    .msg-bubble.error {
      border-color: rgba(229,57,53,0.4);
      background: rgba(229,57,53,0.06);
      color: var(--accent-light);
    }
    .msg-text { color: var(--text-primary); word-break: break-word; }
    .msg-text p { margin-bottom: 8px; }
    .msg-text p:last-child { margin-bottom: 0; }
    .msg-text h2, .msg-text h3, .msg-text h4, .msg-text h5 {
      color: var(--text-primary); margin: 16px 0 8px; font-weight: 700;
    }
    .msg-text h2 { font-size: 20px; }
    .msg-text h3 { font-size: 17px; }
    .msg-text h4 { font-size: 15px; }
    .msg-text h5 { font-size: 14px; }
    .msg-text ul { padding-right: 20px; margin: 8px 0; }
    .msg-text li { margin-bottom: 4px; color: var(--text-primary); }
    .msg-text strong { color: #fff; font-weight: 700; }
    .msg-text em { color: var(--text-secondary); }
    .msg-text a { color: var(--accent-light); text-decoration: underline; }

    /* Inline code */
    .inline-code {
      background: var(--code-bg); border: 1px solid var(--border);
      padding: 2px 7px; border-radius: 5px; font-family: 'Fira Code', monospace;
      font-size: 13px; color: #e06c75;
    }

    /* Code block */
    .code-wrap {
      margin: 12px 0; border-radius: var(--radius-sm);
      border: 1px solid var(--border); overflow: hidden;
      background: var(--code-bg);
    }
    .code-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; background: var(--code-header);
      border-bottom: 1px solid var(--border);
    }
    .code-lang { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .code-copy {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 5px; border: none;
      background: transparent; color: var(--text-muted);
      font-family: inherit; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .code-copy:hover { background: var(--bg-hover); color: var(--text-primary); }
    .code-copy.copied { color: #43a047; }
    .code-copy svg { width: 13px; height: 13px; }
    .code-pre {
      margin: 0; padding: 14px; overflow-x: auto;
      font-family: 'Fira Code', monospace; font-size: 13px;
      line-height: 1.65; background: transparent !important;
    }
    .code-pre code { background: transparent !important; padding: 0 !important; }

    /* Math block */
    .math-block {
      margin: 14px 0; padding: 18px; text-align: center;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow-x: auto;
    }
    .math-block .katex-display { margin: 0; }
    .math-inline .katex { font-size: 1.05em; }

    /* Message actions */
    .msg-actions {
      display: flex; gap: 4px; margin-top: 8px; opacity: 0;
      transition: opacity 0.2s;
    }
    .msg-row:hover .msg-actions { opacity: 1; }
    .msg-act-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 6px; border: none;
      background: var(--bg-tertiary); color: var(--text-muted);
      font-family: inherit; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .msg-act-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .msg-act-btn svg { width: 14px; height: 14px; }

    /* Typing */
    .typing-row { display: flex; gap: 12px; padding: 12px 0; max-width: 88%; margin-left: auto; margin-right: 0; }
    .typing-dots { display: flex; gap: 5px; padding: 14px 20px; background: var(--bot-bubble); border: 1px solid var(--bot-bubble-border); border-radius: var(--radius); border-top-left-radius: 4px; }
    .typing-dots span {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    }
    .typing-dots span:nth-child(1) { animation: dotBounce 1.4s infinite 0s; }
    .typing-dots span:nth-child(2) { animation: dotBounce 1.4s infinite 0.2s; }
    .typing-dots span:nth-child(3) { animation: dotBounce 1.4s infinite 0.4s; }
    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* === INPUT AREA === */
    .input-area {
      padding: 16px 24px 20px;
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
    }
    .input-box {
      max-width: 780px; margin: 0 auto;
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px 6px 6px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within {
      border-color: var(--accent-dark);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .input-box textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-family: inherit; font-size: 14.5px;
      line-height: 1.6; resize: none; padding: 8px 0;
      max-height: 150px; min-height: 22px;
      direction: rtl;
    }
    .input-box textarea::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 42px; height: 42px; min-width: 42px;
      border-radius: var(--radius-sm); border: none;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .send-btn:hover { background: var(--accent-light); transform: scale(1.05); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 20px; height: 20px; }

    /* === DELETE MODAL === */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px); z-index: 500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.25s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal-card {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px; width: 380px; max-width: 90vw;
      text-align: center; direction: rtl;
      transform: scale(0.9); transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    }
    .modal-overlay.open .modal-card { transform: scale(1); }
    .modal-icon {
      width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 18px;
      background: rgba(229,57,53,0.1); border: 2px solid rgba(229,57,53,0.3);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); animation: modalIconPulse 2s ease-in-out infinite;
    }
    @keyframes modalIconPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.2); }
      50% { box-shadow: 0 0 0 10px rgba(229,57,53,0); }
    }
    .modal-icon svg { width: 26px; height: 26px; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.7; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1; padding: 12px; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; border: none;
    }
    .modal-btn.cancel {
      background: var(--bg-tertiary); color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .modal-btn.cancel:hover { background: var(--bg-hover); color: var(--text-primary); }
    .modal-btn.delete {
      background: var(--accent); color: #fff;
    }
    .modal-btn.delete:hover { background: var(--accent-light); box-shadow: 0 4px 16px var(--accent-glow-md); }

    /* === TOAST === */
    .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 600; }
    .toast {
      padding: 10px 20px; border-radius: var(--radius-sm);
      background: var(--bg-tertiary); border: 1px solid var(--border);
      color: var(--text-primary); font-size: 13px; font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(12px);
      transition: all 0.3s cubic-bezier(.4,0,.2,1);
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed; right: 0; top: 0; bottom: 0;
        transform: translateX(100%);
        box-shadow: -8px 0 32px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.show { display: block; }
      .menu-btn { display: flex; }
      .suggestions { grid-template-columns: 1fr; }
      .msg-row { max-width: 95%; }
      .messages-inner { padding: 0 14px; }
      .input-area { padding: 12px 14px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-logo rtl">
          <img src="https://screenifyplus.online/logo.png" alt="Screenify+">
          <span>Screenify<em>+</em></span>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()" aria-label="محادثة جديدة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          محادثة جديدة
        </button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main -->
    <main class="main">
      <header class="main-header">
        <div class="header-left">
          <button class="menu-btn" onclick="toggleSidebar()" aria-label="القائمة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="model-dd" id="modelDropdown">
            <button class="model-dd-trigger" onclick="toggleModelDD()" aria-label="اختيار النموذج">
              <span class="model-dd-icon" id="triggerIcon">?</span>
              <span id="triggerName">جاري التحميل...</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="model-dd-menu" id="modelMenu"></div>
          </div>
        </div>
      </header>

      <div class="messages-wrap" id="messagesWrap">
        <div class="messages-inner" id="messagesInner"></div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="msgInput" placeholder="اكتب رسالتك..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="إرسال">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-card">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="modal-title">هل أنت متأكد؟</div>
      <div class="modal-desc">سيتم حذف هذه المحادثة نهائياً ولا يمكن استرجاعها.</div>
      <div class="modal-btns">
        <button class="modal-btn cancel" onclick="closeDeleteModal()">إلغاء</button>
        <button class="modal-btn delete" id="confirmDeleteBtn" onclick="confirmDelete()">حذف</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    const WORKER_URL = 'https://deepseek.iliassahnoun23.workers.dev';

    /* === حالة التطبيق === */
    let chats = JSON.parse(localStorage.getItem('screenify_chats') || '[]');
    let currentChatIdx = -1;
    let currentApiId = null;
    let messages = [];
    let models = [];
    let currentModel = '';
    let isLoading = false;
    let lastUserMsg = '';
    let deleteTargetIdx = -1;
    let ddOpen = false;

    /* === ألوان النماذج === */
    const COLORS = ['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00acc1','#f4511e','#3949ab','#7cb342','#d81b60','#00897b','#5e35b1'];
    function modelColor(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = ((h << 5) - h) + name.charCodeAt(i) | 0;
      return COLORS[Math.abs(h) % COLORS.length];
    }
    function modelInit(name) {
      const clean = name.replace(/deepseek-?/i, '').replace(/gpt-?/i, '').replace(/claude-?/i, '').trim();
      return clean ? clean.substring(0, 2).toUpperCase() : name.substring(0, 2).toUpperCase();
    }

    /* === تهريب HTML === */
    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    /* === عرض المحتوى (Markdown + كود + رياضيات) === */
    function renderContent(text) {
      if (!text) return '';
      const codeBlocks = [], inlineCodes = [], mathBlocks = [];

      // حماية كتل الكود
      text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        codeBlocks.push({ lang: lang || 'code', code: code.replace(/\n$/, '') });
        return `__CB_${codeBlocks.length - 1}__`;
      });
      // حماية الكود المضمن
      text = text.replace(/`([^`\n]+)`/g, (_, c) => {
        inlineCodes.push(c);
        return `__IC_${inlineCodes.length - 1}__`;
      });
      // حماية كتل الرياضيات
      text = text.replace(/\$\$([\s\S]*?)\$\$/g, (_, m) => {
        mathBlocks.push(m.trim());
        return `__MB_${mathBlocks.length - 1}__`;
      });
      // رياضيات مضمنة
      text = text.replace(/\$([^\$\n]+?)\$/g, (_, m) => {
        if (typeof katex !== 'undefined') {
          try { return '<span class="math-inline">' + katex.renderToString(m.trim(), { throwOnError: false, displayMode: false }) + '</span>'; }
          catch { return '$' + esc(m) + '$'; }
        }
        return '$' + esc(m) + '$';
      });
      // تنسيق Markdown أساسي
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
      text = text.replace(/^#### (.+)$/gm, '<h5>$1</h5>');
      text = text.replace(/^### (.+)$/gm, '<h4>$1</h4>');
      text = text.replace(/^## (.+)$/gm, '<h3>$1</h3>');
      text = text.replace(/^# (.+)$/gm, '<h2>$1</h2>');
      // قوائم
      text = text.replace(/^(\s*)[-*] (.+)$/gm, '$1<li>$2</li>');
      text = text.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g, '<ul>$1</ul>');
      // فواصل أسطر
      text = text.replace(/\n/g, '<br>');

      // استعادة كتل الرياضيات
      mathBlocks.forEach((m, i) => {
        if (typeof katex !== 'undefined') {
          try { text = text.replace(`__MB_${i}__`, '<div class="math-block">' + katex.renderToString(m, { throwOnError: false, displayMode: true }) + '</div>'); }
          catch { text = text.replace(`__MB_${i}__`, '<div class="math-block">$$' + esc(m) + '$$</div>'); }
        } else {
          text = text.replace(`__MB_${i}__`, '<div class="math-block">$$' + esc(m) + '$$</div>');
        }
      });
      // استعادة الكود المضمن
      inlineCodes.forEach((c, i) => {
        text = text.replace(`__IC_${i}__`, '<code class="inline-code">' + esc(c) + '</code>');
      });
      // استعادة كتل الكود
      codeBlocks.forEach((b, i) => {
        let hl;
        if (typeof hljs !== 'undefined') {
          try {
            hl = (b.lang && hljs.getLanguage(b.lang)) ? hljs.highlight(b.code, { language: b.lang }).value : hljs.highlightAuto(b.code).value;
          } catch { hl = esc(b.code); }
        } else { hl = esc(b.code); }
        const html = `<div class="code-wrap"><div class="code-head"><span class="code-lang">${esc(b.lang)}</span><button class="code-copy" onclick="copyCode(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>نسخ</button></div><pre class="code-pre"><code>${hl}</code></pre></div>`;
        text = text.replace(`__CB_${i}__`, html);
      });
      // تنظيف فواصل أسطر زائدة حول العناصر الكتلية
      text = text.replace(/<br>\s*(<h[2-5]|<ul|<div class="(math-block|code-wrap)])/g, '$1');
      text = text.replace(/(<\/h[2-5]>|<\/ul>|<\/div>)\s*<br>/g, '$1');
      return text;
    }

    /* === عرض رسالة المستخدم === */
    function renderUserText(text) {
      let h = esc(text);
      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
      h = h.replace(/\n/g, '<br>');
      return h;
    }

    /* === رسم الرسائل === */
    function renderMessages() {
      const el = document.getElementById('messagesInner');
      if (messages.length === 0) {
        el.innerHTML = renderWelcome();
        return;
      }
      let html = '';
      messages.forEach((m, i) => {
        if (m.role === 'user') {
          html += `<div class="msg"><div class="msg-row user">
            <div class="msg-avatar" style="background:var(--accent)">أنت</div>
            <div>
              <div class="msg-bubble"><div class="msg-text">${renderUserText(m.text)}</div></div>
              <div class="msg-actions"><button class="msg-act-btn" onclick="copyText(${i},'user')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>نسخ</button></div>
            </div>
          </div></div>`;
        } else {
          const col = modelColor(m.model || '');
          const ini = modelInit(m.model || '');
          const isLast = i === messages.length - 1;
          html += `<div class="msg"><div class="msg-row bot">
            <div class="msg-avatar" style="background:${col}">${ini}</div>
            <div style="flex:1;min-width:0">
              <div class="msg-bubble${m.isError ? ' error' : ''}"><div class="msg-text">${renderContent(m.text)}</div></div>
              <div class="msg-actions">
                <button class="msg-act-btn" onclick="copyText(${i},'bot')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>نسخ الرد</button>
                ${isLast ? `<button class="msg-act-btn" onclick="regenerate()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>إعادة التوليد</button>` : ''}
              </div>
            </div>
          </div></div>`;
        }
      });
      el.innerHTML = html;
      scrollToBottom();
    }

    /* === شاشة الترحيب === */
    function renderWelcome() {
      return `<div class="welcome">
        <img src="https://screenifyplus.online/logo.png" alt="Screenify+" class="welcome-logo">
        <h2>مرحباً بك في Screenify<em>+</em></h2>
        <p>اختر نموذجاً وابدأ محادثتك الذكية</p>
        <div class="suggestions">
          <div class="sug-card" onclick="useSug('اشرح لي مفهوم التعلم العميق وكيف يعمل')">
            <div class="sug-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg></div>
            <div class="sug-card-text">اشرح لي مفهوم التعلم العميق وكيف يعمل</div>
          </div>
          <div class="sug-card" onclick="useSug('اكتب كود بايثون لفرز مصفوفة باستخدام خوارزمية Quick Sort')">
            <div class="sug-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
            <div class="sug-card-text">اكتب كود بايثون لفرز مصفوفة بخوارزمية Quick Sort</div>
          </div>
          <div class="sug-card" onclick="useSug('حل المعادلة التربيعية x² + 5x + 6 = 0 مع شرح الخطوات')">
            <div class="sug-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg></div>
            <div class="sug-card-text">حل المعادلة التربيعية x² + 5x + 6 = 0 مع شرح الخطوات</div>
          </div>
          <div class="sug-card" onclick="useSug('اكتب لي مقالاً قصيراً عن مستقبل الذكاء الاصطناعي')">
            <div class="sug-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
            <div class="sug-card-text">اكتب مقالاً قصيراً عن مستقبل الذكاء الاصطناعي</div>
          </div>
        </div>
      </div>`;
    }

    /* === قائمة المحادثات === */
    function renderChatList() {
      const el = document.getElementById('chatList');
      if (chats.length === 0) {
        el.innerHTML = '<div class="sidebar-empty">لا توجد محادثات سابقة</div>';
        return;
      }
      el.innerHTML = chats.map((c, i) => {
        const col = modelColor(c.lastModel || 'default');
        const ini = modelInit(c.lastModel || 'SC');
        const active = i === currentChatIdx ? ' active' : '';
        return `<div class="chat-item${active}" onclick="switchToChat(${i})">
          <div class="chat-item-icon" style="background:${col}">${ini}</div>
          <div class="chat-item-info">
            <div class="chat-item-title">${esc(c.title)}</div>
            <div class="chat-item-time">${timeAgo(c.createdAt)}</div>
          </div>
          <button class="chat-item-del" onclick="event.stopPropagation();askDelete(${i})" aria-label="حذف">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          </button>
        </div>`;
      }).join('');
    }

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return 'الآن';
      const m = Math.floor(s / 60);
      if (m < 60) return `منذ ${m} د`;
      const h = Math.floor(m / 60);
      if (h < 24) return `منذ ${h} س`;
      const d = Math.floor(h / 24);
      if (d < 30) return `منذ ${d} ي`;
      return new Date(ts).toLocaleDateString('ar');
    }

    function saveChats() { localStorage.setItem('screenify_chats', JSON.stringify(chats)); }

    /* === إدارة المحادثات === */
    function createNewChat() {
      if (isLoading) return;
      currentChatIdx = -1;
      currentApiId = null;
      messages = [];
      renderMessages();
      renderChatList();
      closeSidebar();
    }

    async function switchToChat(idx) {
      if (isLoading || idx === currentChatIdx) return;
      currentChatIdx = idx;
      currentApiId = chats[idx].apiId;
      messages = [];
      renderMessages();
      renderChatList();
      closeSidebar();
      await loadHistory();
    }

    async function loadHistory() {
      if (!currentApiId) return;
      try {
        const res = await fetch(`${WORKER_URL}/api/chat?chatId=${currentApiId}`);
        if (!res.ok) { messages = []; renderMessages(); return; }
        const data = await res.json();
        const hist = data.history || [];
        messages = [];
        hist.forEach(t => {
          messages.push({ role: 'user', text: t.user });
          messages.push({ role: 'bot', text: t.bot, model: data.model_used || '' });
        });
        if (messages.length > 0) {
          lastUserMsg = messages[messages.length - 2]?.text || '';
        }
        renderMessages();
      } catch (e) { /* تجاهل */ }
    }

    /* === حذف المحادثة === */
    function askDelete(idx) {
      deleteTargetIdx = idx;
      document.getElementById('deleteModal').classList.add('open');
    }
    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('open');
      deleteTargetIdx = -1;
    }
    function confirmDelete() {
      if (deleteTargetIdx < 0) return;
      chats.splice(deleteTargetIdx, 1);
      saveChats();
      if (deleteTargetIdx === currentChatIdx) {
        currentChatIdx = -1;
        currentApiId = null;
        messages = [];
        renderMessages();
      } else if (deleteTargetIdx < currentChatIdx) {
        currentChatIdx--;
      }
      closeDeleteModal();
      renderChatList();
      showToast('تم حذف المحادثة');
    }

    /* === النماذج === */
    async function loadModels() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();
        models = data.models || [];
        if (models.length > 0) currentModel = models[0];
        buildModelMenu();
        updateTrigger();
      } catch (e) {
        document.getElementById('triggerName').textContent = 'خطأ في التحميل';
      }
    }

    function buildModelMenu() {
      const menu = document.getElementById('modelMenu');
      menu.innerHTML = models.map(m => {
        const col = modelColor(m);
        const ini = modelInit(m);
        const active = m === currentModel ? ' active' : '';
        return `<div class="model-dd-option${active}" onclick="selectModel('${m.replace(/'/g, "\\'")}')">
          <span class="opt-icon" style="background:${col}">${ini}</span>
          <span>${esc(m)}</span>
          ${active ? '<svg class="opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
        </div>`;
      }).join('');
    }

    function selectModel(m) {
      currentModel = m;
      ddOpen = false;
      document.getElementById('modelDropdown').classList.remove('open');
      buildModelMenu();
      updateTrigger();
    }

    function updateTrigger() {
      const icon = document.getElementById('triggerIcon');
      const name = document.getElementById('triggerName');
      icon.style.background = modelColor(currentModel);
      icon.textContent = modelInit(currentModel);
      name.textContent = currentModel;
    }

    function toggleModelDD() {
      ddOpen = !ddOpen;
      document.getElementById('modelDropdown').classList.toggle('open', ddOpen);
    }

    // إغلاق القائمة عند الضغط خارجها
    document.addEventListener('click', e => {
      if (!e.target.closest('#modelDropdown') && ddOpen) {
        ddOpen = false;
        document.getElementById('modelDropdown').classList.remove('open');
      }
    });

    /* === إرسال الرسالة === */
    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || isLoading) return;
      input.value = '';
      autoResize(input);
      lastUserMsg = text;

      // إنشاء محادثة جديدة إذا لزم
      if (currentChatIdx === -1) {
        chats.unshift({ apiId: null, title: text.substring(0, 60), createdAt: Date.now(), lastModel: currentModel });
        currentChatIdx = 0;
        saveChats();
        renderChatList();
      }

      messages.push({ role: 'user', text });
      renderMessages();
      setLoading(true);

      const payload = { model: currentModel, message: text };
      if (currentApiId) payload.chatId = currentApiId;

      try {
        const res = await fetch(`${WORKER_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.chatId) {
          currentApiId = data.chatId;
          chats[currentChatIdx].apiId = data.chatId;
          chats[currentChatIdx].lastModel = data.model_used || currentModel;
          saveChats();
          renderChatList();
        }
        setLoading(false);
        if (data.reply) {
          messages.push({ role: 'bot', text: data.reply, model: data.model_used || currentModel });
        } else {
          messages.push({ role: 'bot', text: data.error || 'حدث خطأ غير متوقع', model: currentModel, isError: true });
        }
        renderMessages();
      } catch (e) {
        setLoading(false);
        messages.push({ role: 'bot', text: 'تعذر الاتصال بالخادم، تحقق من اتصالك بالإنترنت', model: currentModel, isError: true });
        renderMessages();
      }
    }

    /* === إعادة التوليد === */
    async function regenerate() {
      if (isLoading || !lastUserMsg) return;
      // إزالة آخر رد
      if (messages.length > 0 && messages[messages.length - 1].role === 'bot') {
        messages.pop();
        renderMessages();
      }
      setLoading(true);
      const payload = { model: currentModel, message: lastUserMsg };
      if (currentApiId) payload.chatId = currentApiId;
      try {
        const res = await fetch(`${WORKER_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        setLoading(false);
        if (data.reply) {
          messages.push({ role: 'bot', text: data.reply, model: data.model_used || currentModel });
        } else {
          messages.push({ role: 'bot', text: data.error || 'حدث خطأ', model: currentModel, isError: true });
        }
        renderMessages();
      } catch (e) {
        setLoading(false);
        messages.push({ role: 'bot', text: 'تعذر الاتصال بالخادم', model: currentModel, isError: true });
        renderMessages();
      }
    }

    /* === حالة التحميل === */
    function setLoading(on) {
      isLoading = on;
      document.getElementById('sendBtn').disabled = on;
      const inner = document.getElementById('messagesInner');
      // إزالة المؤشر السابق
      const old = inner.querySelector('.typing-row');
      if (old) old.remove();
      if (on) {
        const col = modelColor(currentModel);
        const ini = modelInit(currentModel);
        inner.insertAdjacentHTML('beforeend', `<div class="typing-row"><div class="msg-avatar" style="background:${col}">${ini}</div><div class="typing-dots"><span></span><span></span><span></span></div></div>`);
        scrollToBottom();
      }
    }

    /* === نسخ === */
    function copyText(idx, role) {
      const text = messages[idx]?.text;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => showToast('تم النسخ'));
    }

    function copyCode(btn) {
      const code = btn.closest('.code-wrap').querySelector('code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>تم النسخ';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>نسخ';
        }, 2000);
      });
    }

    /* === إشعارات === */
    function showToast(msg) {
      const wrap = document.getElementById('toastWrap');
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      wrap.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 300);
      }, 2000);
    }

    /* === أدوات مساعدة === */
    function scrollToBottom() {
      const w = document.getElementById('messagesWrap');
      requestAnimationFrame(() => w.scrollTop = w.scrollHeight);
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function useSug(text) {
      document.getElementById('msgInput').value = text;
      autoResize(document.getElementById('msgInput'));
      sendMessage();
    }

    /* === الشريط الجانبي (موبايل) === */
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('show');
    }

    /* === ترحيل البيانات القديمة === */
    function migrateOld() {
      const oldId = localStorage.getItem('deepseek_chatId');
      if (oldId && chats.length === 0) {
        chats.push({ apiId: oldId, title: 'محادثة سابقة', createdAt: Date.now() - 86400000, lastModel: '' });
        saveChats();
        localStorage.removeItem('deepseek_chatId');
      }
    }

    /* === التهيئة === */
    migrateOld();
    loadModels();
    renderChatList();
    renderMessages();

    // تحميل آخر محادثة تلقائياً
    if (chats.length > 0) {
      currentChatIdx = 0;
      currentApiId = chats[0].apiId;
      renderChatList();
      loadHistory();
    }
  </script>
</body>
</html>
