<!DOCTYPE html>
<html lang="en">
<head>

  <title>SCREENIFY+ TV · Full Channel Guide</title>
  <link rel="icon" href="https://h.top4top.io/p_37379uc361.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050507;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
      height: 100%;
      overflow: hidden;
    }

    :root {
      --bg: #050507;
      --surface: #0c0c10;
      --surface2: #121216;
      --border: rgba(255,255,255,0.06);
      --red: #ff1a2e;
      --red-glow: rgba(255,26,46,0.2);
      --gold: #ffd966;
      --muted: #8e8ea8;
      --nav-h: 60px;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 10px; }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* New Back Button */
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: 0.2s;
      background: var(--surface2);
      padding: 6px 12px;
      border-radius: 40px;
      border: 1px solid var(--border);
    }
    .back-btn:hover {
      color: white;
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
    }
    .back-btn svg { width: 16px; height: 16px; }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem;
      background: linear-gradient(135deg, #ff1a2e 0%, #ff6b35 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .live-badge {
      background: rgba(255,26,46,0.12);
      border: 1px solid rgba(255,26,46,0.3);
      border-radius: 30px;
      padding: 4px 10px;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--red);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

    .search-wrap {
      position: relative;
      width: 260px;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--muted);
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 9px 12px 9px 36px;
      font-family: inherit;
      font-size: 0.8rem;
      color: white;
      outline: none;
      transition: 0.2s;
    }
    #searchInput:focus {
      border-color: var(--red);
    }
    #searchInput::placeholder {
      color: var(--muted);
    }

    /* AD BLOCKER WARNING BANNER */
    .ad-warning {
      background: rgba(255, 180, 40, 0.12);
      border-left: 4px solid #ffb428;
      border-right: 1px solid var(--border);
      backdrop-filter: blur(4px);
      padding: 10px 20px;
      font-size: 0.75rem;
      color: #ffd966;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
      border-bottom: 1px solid rgba(255,180,40,0.2);
      font-weight: 500;
    }
    .ad-warning svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #ffb428;
      stroke-width: 2;
    }
    .ad-warning strong {
      color: #ffb428;
      font-weight: 700;
    }
    @media (max-width: 680px) {
      .ad-warning { font-size: 0.7rem; padding: 8px 12px; gap: 6px; }
    }

    .filters {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
      flex-shrink: 0;
    }
    .chip {
      background: transparent;
      border: 1px solid var(--border);
      padding: 5px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { background: rgba(255,255,255,0.05); color: white; }
    .chip.active { background: var(--red); border-color: var(--red); color: white; }

    .channel-container {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      flex: 1;
    }

    .channel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      transition: all 0.15s ease;
      cursor: pointer;
      height: fit-content;
    }
    .channel-card:hover {
      background: #13131a;
      border-color: rgba(255,26,46,0.4);
      transform: translateY(-1px);
    }
    .channel-card.active {
      background: rgba(255,26,46,0.12);
      border-left: 3px solid var(--red);
    }

    .channel-logo {
      width: 44px;
      height: 44px;
      background: var(--surface2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--muted);
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .channel-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }
    .channel-info {
      flex: 1;
      min-width: 0;
    }
    .channel-name {
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-number {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .fav-star {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      transition: 0.1s;
      border-radius: 30px;
    }
    .fav-star.on { color: var(--gold); }
    .fav-star.on svg { fill: var(--gold); }

    .empty-msg {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Footer Links */
    .app-footer {
      text-align: center;
      padding: 24px 20px;
      margin-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
    }
    .app-footer a {
      color: var(--muted);
      text-decoration: none;
      margin: 0 10px;
      transition: 0.2s;
    }
    .app-footer a:hover {
      color: white;
    }

    /* MODAL PLAYER */
    .modal-player {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-player.open { display: flex; }
    .modal-content {
      width: 90%;
      max-width: 1300px;
      background: #0a0a0c;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 45px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-header h3 span {
      color: var(--red);
      font-size: 0.75rem;
      background: rgba(255,26,46,0.2);
      padding: 2px 8px;
      border-radius: 50px;
    }
    .close-modal {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-modal:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .video-frame iframe {
      width: 100%;
      height: 65vh;
      min-height: 400px;
      border: none;
      display: block;
    }
    @media (max-width: 700px) {
      .video-frame iframe { height: 55vh; }
      .modal-content { width: 96%; }
    }

    /* mobile nav */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 58px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 100;
    }
    .mobile-tabs {
      display: flex;
      height: 100%;
    }
    .mob-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.6rem;
      font-weight: 600;
      cursor: pointer;
    }
    .mob-tab svg { width: 20px; height: 20px; }
    .mob-tab.active { color: var(--red); }

    /* mobile sheet */
    .sheet {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
    }
    .sheet.open { display: flex; flex-direction: column; }
    .sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
    }
    .sheet-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .sheet-header h4 { font-family: 'Bebas Neue', sans-serif; color: var(--red); font-size: 1.3rem; }
    .sheet-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .sheet-filters {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }
    .sheet-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 20px;
    }
    .mobile-channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 14px;
      cursor: pointer;
    }
    .mobile-channel-item.active {
      background: rgba(255,26,46,0.1);
    }

    .toast-msg {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e28;
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.75rem;
      z-index: 2100;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast-msg.show { opacity: 1; bottom: 90px; }

    @media (max-width: 680px) {
      .top-bar { padding: 0 12px; }
      .channel-container { padding: 12px; margin-bottom: 58px; }
      .channel-grid { grid-template-columns: 1fr; gap: 8px; }
      .mobile-nav { display: block; }
      .search-wrap { width: 180px; }
      .logo { display: none; }
    }
    @media (min-width: 681px) { .sheet { display: none !important; } }
  </style>
</head>

  const cleanRaw = RAW.filter(c => {
    const nameLower = c.n.toLowerCase();
    return !blockedKeywords.some(kw => nameLower.includes(kw));
  });

  const CHANNELS = [];
  const seenIds = new Set();
  for (const c of cleanRaw) {
    if (!seenIds.has(c.s)) {
      seenIds.add(c.s);
      CHANNELS.push(c);
    }
  }
  CHANNELS.sort((a,b) => a.n.localeCompare(b.n));

  let currentFilter = 'all';
  let searchQuery = '';
  let favs = JSON.parse(localStorage.getItem('sf_f') || '[]');
  let selectedChannel = null;

  function saveFavs() { localStorage.setItem('sf_f', JSON.stringify(favs)); }

  function getCategory(ch) {
    const n = ch.n.toLowerCase();
    if (/ uk$|\bitv\b|\bbbc\b|\bsky\b|\bdave\b|\bfilm4\b|\bchannel 4/.test(n)) return 'uk';
    if (/france|tf1|m6|rmc sport|canal\+.*france/.test(n)) return 'fr';
    if (/ de$|ard|zdf|sat\.1|sixx|mdr|ndr|swr|wdr|3sat/.test(n)) return 'de';
    if (/ italy|rai |sky calcio|italia 1|la7/.test(n)) return 'it';
    if (/ spain|movistar|dazn.*spain|telecinco|antena 3|laliga/.test(n)) return 'es';
    if (/sport|espn|nfl|nba|golf|tennis|bein|dazn|eurosport|football|cricket|racing|motogp|f1/.test(n)) return 'sports';
    if (/news|cnn|msnbc|cnbc|bloomberg|al jazeera|newsmax/.test(n)) return 'news';
    if (/cinema|movie|film|hbo|starz|lifetime|hallmark|showtime/.test(n)) return 'movies';
    return 'usa';
  }

  function getFilteredList() {
    let list = [...CHANNELS];
    if (searchQuery) list = list.filter(c => c.n.toLowerCase().includes(searchQuery));
    if (currentFilter === 'fav') return list.filter(c => favs.includes(c.s));
    if (currentFilter !== 'all') return list.filter(c => getCategory(c) === currentFilter);
    return list;
  }

  function logoHtml(ch, size = 40) {
    const init = ch.n.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    const slug = ch.n.replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0,18);
    return `<img src="https://cdn.brandfetch.io/${slug}.com/w/${size}/h/${size}?c=1id" style="width:100%;height:100%;object-fit:contain;padding:4px;" onerror="this.parentNode.innerHTML='<span style=font-weight:700;font-size:0.7rem;>${init}</span>'">`;
  }

  function renderGrid() {
    const list = getFilteredList();
    const favItems = list.filter(c => favs.includes(c.s));
    const otherItems = list.filter(c => !favs.includes(c.s));
    let html = '';
    if (favItems.length && currentFilter !== 'fav') {
      html += `<div style="grid-column:1/-1; margin:6px 0 4px 8px; font-size:0.7rem; font-weight:700; color:var(--gold);">⭐ FAVOURITES</div>`;
      favItems.forEach(ch => { html += cardTemplate(ch); });
      if (otherItems.length) html += `<div style="grid-column:1/-1; height:1px; background:rgba(255,255,255,0.05); margin:8px 0;"></div>`;
    }
    otherItems.forEach(ch => { html += cardTemplate(ch); });
    if (list.length === 0) html = `<div class="empty-msg">📺 No channels found</div>`;
    document.getElementById('channelGrid').innerHTML = html;
    renderSheet();
  }

  function cardTemplate(ch) {
    const isFav = favs.includes(ch.s);
    const activeClass = (selectedChannel && selectedChannel.s === ch.s) ? 'active' : '';
    return `
      <div class="channel-card ${activeClass}" onclick="playChannel(${ch.s})">
        <div class="channel-logo">${logoHtml(ch, 42)}</div>
        <div class="channel-info">
          <div class="channel-name">${escapeHtml(ch.n)}</div>
          <div class="channel-number">#${ch.s}</div>
        </div>
        <button class="fav-star ${isFav ? 'on' : ''}" onclick="event.stopPropagation(); toggleFav(${ch.s})">
          <svg width="18" height="18" fill="${isFav ? 'var(--gold)' : 'none'}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
      </div>
    `;
  }

  function renderSheet() {
    const list = getFilteredList();
    let html = '';
    list.forEach(ch => {
      const isFav = favs.includes(ch.s);
      const active = (selectedChannel && selectedChannel.s === ch.s) ? 'active' : '';
      html += `
        <div class="mobile-channel-item ${active}" onclick="playChannel(${ch.s}); closeSheet();">
          <div class="channel-logo" style="width:38px;height:38px;">${logoHtml(ch, 38)}</div>
          <div class="channel-info"><div class="channel-name">${escapeHtml(ch.n)}</div><div class="channel-number">#${ch.s}</div></div>
          <button class="fav-star ${isFav ? 'on' : ''}" onclick="event.stopPropagation(); toggleFav(${ch.s})"><svg width="16" height="16" fill="${isFav ? 'var(--gold)' : 'none'}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
        </div>
      `;
    });
    if (list.length === 0) html = `<div class="empty-msg">No channels</div>`;
    document.getElementById('sheetList').innerHTML = html;
    const sheetFilterDiv = document.getElementById('sheetFilters');
    sheetFilterDiv.innerHTML = `
      <button class="chip ${currentFilter==='all'?'active':''}" onclick="setFilter('all');renderAll();closeSheet();">All</button>
      <button class="chip ${currentFilter==='fav'?'active':''}" onclick="setFilter('fav');renderAll();closeSheet();">⭐ Favs</button>
      <button class="chip ${currentFilter==='sports'?'active':''}" onclick="setFilter('sports');renderAll();closeSheet();">⚽ Sports</button>
      <button class="chip ${currentFilter==='uk'?'active':''}" onclick="setFilter('uk');renderAll();closeSheet();">🇬🇧 UK</button>
      <button class="chip ${currentFilter==='usa'?'active':''}" onclick="setFilter('usa');renderAll();closeSheet();">🇺🇸 USA</button>
    `;
  }

  function setFilter(f) { currentFilter = f; renderAll(); updateChipActive(); }
  function updateChipActive() { document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === currentFilter)); }
  function renderAll() { renderGrid(); updateChipActive(); }
  function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

  function playChannel(channelId) {
    const channel = CHANNELS.find(c => c.s === channelId);
    if (!channel) return;
    selectedChannel = channel;
    renderAll();
    const embedUrl = `https://daddylives.best/embed/stream-${channel.s}.php`;
    const modal = document.getElementById('playerModal');
    const iframe = document.getElementById('modalIframe');
    document.getElementById('modalChannelName').innerHTML = `${escapeHtml(channel.n)} <span>#${channel.s}</span>`;
    iframe.src = embedUrl;
    modal.classList.add('open');
    showToast(`▶ ${channel.n}`);
  }

  function closeModal() {
    const iframe = document.getElementById('modalIframe');
    iframe.src = 'about:blank';
    document.getElementById('playerModal').classList.remove('open');
  }

  function toggleFav(chId) {
    const idx = favs.indexOf(chId);
    if (idx === -1) { favs.push(chId); showToast('⭐ Added to favourites'); }
    else { favs.splice(idx,1); showToast('♡ Removed from favourites'); }
    saveFavs();
    renderAll();
  }

  function showToast(msg) {
    const t = document.getElementById('toastMessage');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function openSheet() { document.getElementById('mobileSheet').classList.add('open'); }
  function closeSheet() { document.getElementById('mobileSheet').classList.remove('open'); }

  document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderAll(); });
  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', (e) => { currentFilter = btn.dataset.filter; renderAll(); });
  });
  document.getElementById('tabChannels').addEventListener('click', () => openSheet());
  document.getElementById('tabFavs').addEventListener('click', () => { currentFilter = 'fav'; renderAll(); updateChipActive(); openSheet(); });

  renderAll();

  document.getElementById('playerModal').addEventListener('click', (e) => { if (e.target === document.getElementById('playerModal')) closeModal(); });

  window.playChannel = playChannel;
  window.toggleFav = toggleFav;
  window.setFilter = setFilter;
  window.openSheet = openSheet;
  window.closeSheet = closeSheet;
  window.closeModal = closeModal;
  window.renderAll = renderAll;
</script>
</body>
</html>
