<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screenify+ — Live TV</title>
<link rel="icon" href="https://screenifyplus.online/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
<style>
:root{
  --bg:#08090b; --panel:#111318; --panel-2:#171a20; --raised:#1c1f26;
  --red:#ff2d47; --red-dim:rgba(255,45,71,.14); --red-line:rgba(255,45,71,.35);
  --gold:#ffb020; --gold-dim:rgba(255,176,32,.16);
  --text:#f2f3f5; --text-dim:#93969e; --text-faint:#5c5f68;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --telegram:#0088cc; --android:#3ddc84;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}

.app{display:grid;grid-template-columns:264px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"header header" "sidebar main";height:100vh}

/* ---------- Header ---------- */
.header{grid-area:header;display:flex;align-items:center;padding:0 20px;gap:20px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-2);padding:6px}
.logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:6px}
.logo-fallback{font-family:'Outfit';font-weight:900;color:var(--red);font-size:15px}
.brand-name{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.9px;white-space:nowrap;color:#fff}
.brand-plus{color:var(--red);margin-left:1px}
.search-bar{flex:1;max-width:420px;position:relative}
.search-input{width:100%;height:38px;padding:0 14px 0 40px;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-md);color:var(--text);font-size:13.5px;font-family:inherit;outline:none}
.search-input:focus{border-color:var(--red)}
.search-input::placeholder{color:var(--text-faint)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
.header-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.status-pill{display:flex;align-items:center;gap:7px;padding:6px 12px;background:var(--raised);border:1px solid var(--line-2);border-radius:100px;font-size:11.5px;font-weight:600;color:var(--text-dim)}
.status-dot{width:7px;height:7px;background:var(--red);border-radius:50%}
.status-dot.online{background:#3ddc84}
.status-dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- Sidebar ---------- */
.sidebar{grid-area:sidebar;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column}
.sidebar-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-faint);margin:4px 10px 10px}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-item{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 8px;border-radius:var(--r-sm);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--text-dim);border-left:3px solid transparent;user-select:none}
.cat-item:hover{background:var(--raised);color:var(--text)}
.cat-item.active{background:var(--red-dim);color:#fff;border-left-color:var(--red)}
.cat-icon{width:17px;height:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:inherit}
.cat-item span.cat-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-count{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 7px;background:rgba(255,255,255,.06);border-radius:100px;color:var(--text-faint);flex-shrink:0}
.cat-item.active .cat-count{background:rgba(255,45,71,.25);color:#ffb3bd}
.cat-item.fav-item{color:var(--gold)}
.cat-item.fav-item.active{background:var(--gold-dim);border-left-color:var(--gold)}
.cat-divider{height:1px;background:var(--line);margin:10px 4px}

.sidebar-banners{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.banner{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--r-md);text-decoration:none;color:#fff;border:1px solid transparent}
.banner-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.banner-text{display:flex;flex-direction:column;min-width:0}
.banner-title{font-size:12.5px;font-weight:700;line-height:1.25}
.banner-sub{font-size:11px;opacity:.75;margin-top:1px}
.banner-arrow{margin-left:auto;flex-shrink:0;opacity:.55}
.telegram-banner{background:rgba(0,136,204,.14);border-color:rgba(0,136,204,.3)}
.telegram-banner .banner-icon{background:var(--telegram)}
.android-banner{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.3)}
.android-banner .banner-icon{background:var(--android);color:#04150c}

/* ---------- Main / Player ---------- */
.main{grid-area:main;display:flex;flex-direction:column;overflow:hidden}
.player-section{padding:16px 18px 8px;flex-shrink:0}
.player-wrapper{position:relative;background:#000;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;max-height:46vh}
#video{width:100%;height:100%;display:block;cursor:pointer;object-fit:contain;background:#000}
.player-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;opacity:0;transition:opacity .2s}
.player-wrapper:hover .player-overlay,.player-wrapper.controls-visible .player-overlay{opacity:1}
.player-top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.player-info{display:flex;align-items:center;gap:10px;pointer-events:auto;min-width:0}
.live-badge{display:flex;align-items:center;gap:5px;padding:4px 9px;background:var(--red);border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.4px;flex-shrink:0}
.live-dot{width:5px;height:5px;background:#fff;border-radius:50%;animation:pulse 1.4s infinite}
.now-playing{font-size:14px;font-weight:600;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-controls{display:flex;align-items:center;gap:10px;padding:12px 18px;pointer-events:auto;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.ctrl-btn{width:36px;height:36px;border:none;background:rgba(255,255,255,.1);border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ctrl-btn:hover{background:var(--red)}
.ctrl-btn.play-btn{width:46px;height:46px;background:var(--red)}
.ctrl-btn.active{background:var(--red)}
.volume-wrap{display:flex;align-items:center;gap:8px}
.volume-slider{width:72px;height:4px;background:rgba(255,255,255,.22);border-radius:2px;cursor:pointer;position:relative}
.volume-fill{height:100%;background:var(--red);border-radius:2px;width:80%}
.player-spacer{flex:1}
.quality-btn{height:32px;padding:0 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-sm);color:#fff;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.quality-btn:hover{background:var(--red);border-color:var(--red)}

.loader-overlay,.error-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;padding:20px}
.loader-overlay{background:rgba(0,0,0,.55)}
.error-overlay{background:rgba(4,4,5,.92);display:none}
.error-overlay.show{display:flex}
.spinner{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-icon{width:52px;height:52px;border-radius:50%;background:var(--red-dim);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--red)}
.error-msg{font-size:15px;font-weight:700;margin-bottom:6px}
.error-sub{font-size:12.5px;color:var(--text-dim);max-width:320px}

/* ---------- Channels ---------- */
.channels-section{flex:1;padding:6px 18px 16px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.channels-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}
.channels-title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.channels-title{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.channels-count{font-size:12px;color:var(--text-dim);font-weight:600;flex-shrink:0}

.channels-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px, 178px));
  gap:12px;
  overflow-y:auto;
  align-content:start;
  justify-content:start;
  padding-right:2px;
  scrollbar-gutter:stable;
}
.channel-card{
  content-visibility:auto;
  contain-intrinsic-size:178px 168px;
  background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:9px;cursor:pointer;
  display:flex;flex-direction:column;
}
.channel-card:hover{border-color:var(--line-2);background:var(--raised)}
.channel-card.active{border-color:var(--red);background:var(--red-dim)}

.channel-thumb{
  width:100%;aspect-ratio:16/9;
  background:#0d0e11;
  border-radius:var(--r-sm);margin-bottom:9px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.channel-thumb img{width:100%;height:100%;object-fit:contain;padding:10px}
.channel-thumb-letter{font-family:'Outfit';font-size:24px;font-weight:900;color:var(--text-faint)}
.ch-num{position:absolute;top:5px;left:5px;font-size:9.5px;font-weight:800;padding:2px 6px;background:rgba(0,0,0,.55);border-radius:5px;color:var(--text-dim);letter-spacing:.3px}
.playing-indicator{position:absolute;bottom:5px;left:5px;display:none;align-items:center;gap:4px;padding:2px 6px;background:var(--red);border-radius:4px;font-size:8.5px;font-weight:800}
.channel-card.active .playing-indicator{display:flex}
.fav-btn{position:absolute;top:5px;right:5px;width:24px;height:24px;background:rgba(0,0,0,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.9}
.fav-btn svg{width:13px;height:13px;color:#fff}
.fav-btn.active svg{color:var(--gold);fill:var(--gold)}
@media (hover:hover){
  .fav-btn{opacity:0}
  .channel-card:hover .fav-btn{opacity:1}
}

.channel-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.channel-name{font-size:12.5px;font-weight:600;color:var(--text);unicode-bidi:plaintext;text-align:start;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;min-height:2.6em}
.channel-cat{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start}

.load-sentinel{grid-column:1/-1;height:1px}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-md);color:#fff;font-size:13px;font-weight:500;z-index:100;transform:translateX(140%);transition:transform .3s ease;max-width:300px}
.toast.show{transform:translateX(0)}

.empty-state{grid-column:1/-1;padding:44px 20px;text-align:center;color:var(--text-dim)}
.empty-icon{font-size:34px;margin-bottom:10px;opacity:.5}
.empty-text{font-size:14px;margin-bottom:3px;color:var(--text)}
.empty-sub{font-size:12.5px}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:60px 108px 1fr;grid-template-areas:"header" "sidebar" "main"}
  .sidebar{border-right:none;border-bottom:1px solid var(--line);padding:10px;flex-direction:row;gap:10px}
  .sidebar-title{display:none}
  .cat-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;flex:1}
  .cat-item{flex-shrink:0;white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:8px 10px}
  .cat-item.active{border-left-color:transparent;border-bottom-color:var(--red)}
  .cat-item.fav-item.active{border-bottom-color:var(--gold)}
  .cat-divider{display:none}
  .sidebar-banners{flex-direction:row;margin-top:0;padding-top:0;flex-shrink:0}
  .banner{padding:8px;min-width:0}
  .banner-text{display:none}
  .banner-icon{width:30px;height:30px}
  .banner-arrow{display:none}
  .search-bar{display:none}
  .player-wrapper{max-height:28vh}
  .brand-name{font-size:19px}

  .channels-grid{grid-template-columns:repeat(auto-fill, minmax(112px, 1fr));gap:10px}
  .channel-card{padding:7px}
  .channel-name{font-size:11px;min-height:2.4em}
  .channel-cat{font-size:9px}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo" id="logoBox">
        <img src="https://screenifyplus.online/logo.png" alt="S+" id="logoImg">
      </div>
      <div class="brand-name">Screenify<span class="brand-plus">+</span></div>
    </div>
    <div class="search-bar">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search-input" id="searchInput" placeholder="Search channels...">
    </div>
    <div class="header-actions">
      <div class="status-pill">
        <span class="status-dot pulse" id="statusDot"></span>
        <span id="statusText">Connecting</span>
      </div>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-title">Categories</div>
    <div class="cat-list" id="catList">
      <div class="cat-item" style="opacity:.5;cursor:default">Loading…</div>
    </div>

    <div class="sidebar-banners">
      <a href="https://t.me/screenifyplus" target="_blank" class="banner telegram-banner">
        <div class="banner-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 4.5 2.7 11.8c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.5 0 .7-.2 1-.5l2.4-2.3 5 3.6c.9.5 1.6.2 1.8-.8l3.3-15.4c.3-1.3-.5-1.9-1-1.4zM8.7 14.6l10-6.2c.5-.3.9-.1.6.3L11 15.9c-.4.4-.7.6-1.3.8z"/></svg>
        </div>
        <div class="banner-text">
          <div class="banner-title">Join our Telegram</div>
          <div class="banner-sub">t.me/screenifyplus</div>
        </div>
        <svg class="banner-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a href="https://screenifyplus.online" target="_blank" class="banner android-banner">
        <div class="banner-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.5 19.5 6c.1-.3 0-.6-.3-.7-.3-.2-.6 0-.8.3l-1.9 3.5C15 8.3 13.5 8 12 8s-3 .3-4.4.9L5.6 5.5c-.2-.3-.5-.4-.8-.3-.3.1-.4.4-.3.7l1.9 3.5C3.7 11 1.9 13.9 1.5 17.3h21C22 13.9 20.3 11 17.6 9.5zM7 14.7c-.6 0-1.1-.5-1.1-1.1s.5-1.1 1.1-1.1 1.1.5 1.1 1.1-.5 1.1-1.1 1.1zm10 0c-.6 0-1.1-.5-1.1-1.1s.5-1.1 1.1-1.1 1.1.5 1.1 1.1-.5 1.1-1.1 1.1z"/></svg>
        </div>
        <div class="banner-text">
          <div class="banner-title">Install Android app</div>
          <div class="banner-sub">screenifyplus.online</div>
        </div>
        <svg class="banner-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
  </aside>

  <main class="main">
    <div class="player-section">
      <div class="player-wrapper" id="playerWrapper">
        <video id="video" playsinline></video>
        <div class="player-overlay">
          <div class="player-top">
            <div class="player-info">
              <div class="live-badge"><span class="live-dot"></span>LIVE</div>
              <div class="now-playing" id="nowPlaying">Select a channel to start</div>
            </div>
          </div>
          <div class="player-controls">
            <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
              <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn" id="muteBtn" title="Mute">
              <svg id="muteIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <div class="volume-wrap">
              <div class="volume-slider" id="volumeSlider">
                <div class="volume-fill" id="volumeFill"></div>
              </div>
            </div>
            <div class="player-spacer"></div>
            <button class="quality-btn" id="qualityBtn" title="Quality">AUTO</button>
            <button class="ctrl-btn" id="fitBtn" title="Fit Screen">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
            </button>
            <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>
        <div class="loader-overlay" id="loaderOverlay" style="display:none">
          <div class="spinner"></div>
        </div>
        <div class="error-overlay" id="errorOverlay">
          <div class="error-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
          </div>
          <div class="error-msg" id="errorMsg">Failed to load stream</div>
          <div class="error-sub" id="errorSub">Please try another channel</div>
          <button class="quality-btn" id="retryBtn" style="margin-top:14px">Retry</button>
        </div>
      </div>
    </div>

    <div class="channels-section">
      <div class="channels-header">
        <div class="channels-title-wrap">
          <button class="ctrl-btn" id="backBtn" style="display:none;width:32px;height:32px" title="Back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>
          <div class="channels-title" id="channelsTitle">All Channels</div>
        </div>
        <div class="channels-count" id="channelsCount"></div>
      </div>
      <div class="channels-grid" id="channelsGrid">
        <div class="empty-state">
          <div class="empty-icon">📺</div>
          <div class="empty-text">No channels loaded yet</div>
          <div class="empty-sub">Select a category from the sidebar</div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER_URL = 'https://alyaassta.hsinnzaer5.workers.dev';
const API_BASE = WORKER_URL + '/api/';
const PROXY_BASE = WORKER_URL + '/?stream=';
const BATCH_SIZE = 42;

let hls = null, dashPlayer = null, currentChannelId = null, categories = [], currentChannels = [], currentLevel = -1;
let favorites = JSON.parse(localStorage.getItem('screenify_favs') || '[]');
let navHistory = [];
let isFitCover = false;
let lastChannel = null, lastCard = null;
let renderedCount = 0;
let gridObserver = null;

const $ = id => document.getElementById(id);
const video = $('video'), catList = $('catList'), channelsGrid = $('channelsGrid'),
  channelsTitle = $('channelsTitle'), channelsCount = $('channelsCount'),
  nowPlaying = $('nowPlaying'), loaderOverlay = $('loaderOverlay'),
  errorOverlay = $('errorOverlay'), errorMsg = $('errorMsg'), errorSub = $('errorSub'),
  playBtn = $('playBtn'), playIcon = $('playIcon'), muteBtn = $('muteBtn'),
  muteIcon = $('muteIcon'), volumeSlider = $('volumeSlider'), volumeFill = $('volumeFill'),
  fullscreenBtn = $('fullscreenBtn'), qualityBtn = $('qualityBtn'),
  searchInput = $('searchInput'), toast = $('toast'), statusText = $('statusText'),
  statusDot = $('statusDot'), backBtn = $('backBtn'), fitBtn = $('fitBtn');

$('logoImg').addEventListener('error', () => {
  $('logoBox').innerHTML = '<span class="logo-fallback">S+</span>';
});

async function fetchFromBackend(path) {
  const res = await fetch(`${API_BASE}${path}`);
  if (!res.ok) throw new Error(`Status: ${res.status}`);
  return await res.json();
}

async function loadCategories() {
  try {
    statusText.textContent = 'Loading...';
    const res = await fetchFromBackend("categories");

    categories = Array.isArray(res) ? res : (res.data || res.categories || []);
    if (!Array.isArray(categories) || categories.length === 0) throw new Error('Empty');

    categories.unshift({ id: 'favs', name: 'My Favorites', count: favorites.length });
    renderCategories();
    statusText.textContent = 'Online';
    statusDot.classList.add('online');
    statusDot.classList.remove('pulse');

    let initialCat = categories.find(c => c.id == 4) || categories[1];
    if (initialCat) selectCategory(initialCat);
  } catch (e) {
    console.error(e);
    statusText.textContent = 'Offline';
    catList.innerHTML = '<div class="cat-item" style="opacity:.7;cursor:default;color:#ff4d6a">Failed to load</div>';
  }
}

function renderCategories() {
  catList.innerHTML = '';
  categories.forEach((cat, i) => {
    const item = document.createElement('div');
    item.className = 'cat-item' + (cat.id === 'favs' ? ' fav-item' : '');
    item.dataset.id = cat.id;
    const name = cat.name || cat.title || `Category ${i+1}`;
    const count = cat.count || cat.child_count || cat.channels_count || '';

    let iconPath = '<path d="M4 4h16v16H4z" opacity=".4"/><path d="M2 4l5 8-5 8h3l5-8-5-8zm10 0l5 8-5 8h3l5-8-5-8z"/>';
    if (cat.id === 'favs') {
      iconPath = '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>';
    }

    item.innerHTML = `
      <div class="cat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">${iconPath}</svg></div>
      <span class="cat-label">${escapeHtml(name)}</span>${count !== undefined && count !== '' ? `<span class="cat-count">${count}</span>` : ''}`;
    item.onclick = () => selectCategory(cat);
    catList.appendChild(item);
    if (cat.id === 'favs') {
      const div = document.createElement('div');
      div.className = 'cat-divider';
      catList.appendChild(div);
    }
  });
}

async function selectCategory(cat, isBack = false) {
  if (!isBack) {
    if (categories.find(c => c.id == cat.id)) {
      navHistory = [cat];
    } else {
      navHistory.push(cat);
    }
  }

  backBtn.style.display = (navHistory.length > 1) ? 'flex' : 'none';
  document.querySelectorAll('.cat-item').forEach(el => el.classList.toggle('active', el.dataset.id == cat.id));

  channelsTitle.textContent = navHistory.map(c => c.name).join(' › ') || (cat.name || 'Channels');
  channelsCount.textContent = '';
  channelsGrid.innerHTML = '<div class="empty-state"><div class="spinner" style="width:34px;height:34px;margin:0 auto 14px"></div><div class="empty-text">Loading…</div></div>';

  try {
    let chans = [];
    if (cat.id === 'favs') {
      chans = favorites.map(id => currentChannels.find(x => x.id == id) || { id: id, name: 'Channel ' + id });
      if (chans.length === 0) {
        channelsGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">⭐</div><div class="empty-text">No favorites yet</div><div class="empty-sub">Tap the star on a channel to pin it here</div></div>';
        return;
      }
      currentChannels = chans;
      renderChannels(chans);
    } else {
      const catId = encodeURIComponent(cat.id);
      const endpoints = [
        `categories/${catId}/channels`,
        `category/${catId}/channels`,
        `channels?category_id=${catId}`,
        `channels/${catId}`,
        `category/${catId}`
      ];

      for (const ep of endpoints) {
        try {
          const res = await fetchFromBackend(ep);
          const extracted = Array.isArray(res) ? res : (res.data || res.channels || []);
          if (Array.isArray(extracted) && extracted.length > 0) {
            chans = extracted;
            break;
          }
        } catch (e) {}
      }

      if (chans.length === 0) {
        channelsGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">📺</div><div class="empty-text">No channels found</div></div>';
        return;
      }

      currentChannels = chans;
      renderChannels(chans);
    }
  } catch (e) {
    console.error(e);
    channelsGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load</div></div>';
  }
}

backBtn.onclick = () => {
  if (navHistory.length > 1) {
    navHistory.pop();
    selectCategory(navHistory[navHistory.length - 1], true);
  }
};

function renderChannels(chans) {
  if (gridObserver) { gridObserver.disconnect(); gridObserver = null; }
  channelsCount.textContent = `${chans.length} items`;
  channelsGrid.innerHTML = '';
  renderedCount = 0;
  appendBatch(chans);
}

function appendBatch(chans) {
  const frag = document.createDocumentFragment();
  const end = Math.min(renderedCount + BATCH_SIZE, chans.length);

  for (let idx = renderedCount; idx < end; idx++) {
    const ch = chans[idx];
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.dataset.id = ch.id;
    const name = ch.name || ch.title || `Channel ${ch.id}`;
    const firstLetter = (name.charAt(0) || '?').toUpperCase();
    const img = ch.image || ch.logo || ch.icon || '';
    const isFav = favorites.includes(String(ch.id));
    const isFolder = ch.child_count > 0;

    card.innerHTML = `
      <div class="channel-thumb">
        <span class="ch-num">${idx + 1}</span>
        ${img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="channel-thumb-letter" style="display:none;align-items:center;justify-content:center;width:100%;height:100%">${firstLetter}</div>` : `<div class="channel-thumb-letter" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">${firstLetter}</div>`}
        <div class="playing-indicator"><span class="live-dot"></span>LIVE</div>
        ${isFolder ? '' : `<div class="fav-btn ${isFav ? 'active' : ''}" data-fav-id="${ch.id}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </div>`}
      </div>
      <div class="channel-info">
        <div class="channel-name">${escapeHtml(name)}</div>
        <div class="channel-cat">${isFolder ? ch.child_count + ' sub-categories' : 'Channel'}</div>
      </div>`;

    if (isFolder) {
      card.onclick = () => selectCategory(ch);
    } else {
      const favBtn = card.querySelector('.fav-btn');
      if (favBtn) favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(ch.id, e.currentTarget);
      };
      card.onclick = () => playChannel(ch, card);
    }

    if (ch.id == currentChannelId) card.classList.add('active');
    frag.appendChild(card);
  }

  channelsGrid.appendChild(frag);
  renderedCount = end;

  const oldSentinel = channelsGrid.querySelector('.load-sentinel');
  if (oldSentinel) oldSentinel.remove();

  if (renderedCount < chans.length) {
    const sentinel = document.createElement('div');
    sentinel.className = 'load-sentinel';
    channelsGrid.appendChild(sentinel);
    gridObserver = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) {
        gridObserver.disconnect();
        appendBatch(chans);
      }
    }, { root: channelsGrid, rootMargin: '400px' });
    gridObserver.observe(sentinel);
  }
}

function toggleFavorite(id, btn) {
  id = String(id);
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
    btn.classList.remove('active');
    showToast('Removed from favorites');
  } else {
    favorites.push(id);
    btn.classList.add('active');
    showToast('Added to favorites');
  }
  localStorage.setItem('screenify_favs', JSON.stringify(favorites));
  const favItem = document.querySelector('.cat-item[data-id="favs"] .cat-count');
  if (favItem) favItem.textContent = favorites.length;
}

async function playChannel(ch, card) {
  if (!ch || !ch.id) return;
  lastChannel = ch; lastCard = card;
  currentChannelId = ch.id;
  document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
  if (card) card.classList.add('active');

  const name = ch.name || ch.title || 'Channel';
  nowPlaying.textContent = name;
  loaderOverlay.style.display = 'flex';
  errorOverlay.classList.remove('show');

  try {
    const data = await fetchFromBackend(`channel/${encodeURIComponent(ch.id)}`);

    let streamList = [];
    if (Array.isArray(data)) {
      streamList = data;
    } else if (data.data && Array.isArray(data.data)) {
      streamList = data.data;
    } else if (data.servers && Array.isArray(data.servers)) {
      streamList = data.servers;
    } else if (data.streams && Array.isArray(data.streams)) {
      streamList = data.streams;
    } else if (data.result && Array.isArray(data.result)) {
      streamList = data.result;
    } else if (data.url || data.stream_url || data.link || data.file || data.source) {
      streamList = [data];
    }

    if (streamList.length === 0) throw new Error('No stream servers found for this channel');

    const firstServer = streamList[0];
    let rawUrl = firstServer.url || firstServer.stream_url || firstServer.link || firstServer.file || firstServer.source || firstServer.hls || firstServer.dash;
    let keys = firstServer.keys || firstServer.key || firstServer.drm_key || firstServer.clearkeys || data.keys;

    if (!rawUrl) throw new Error('Stream URL missing in server data');

    rawUrl = rawUrl.replace(/\\\//g, '/');
    const proxiedUrl = PROXY_BASE + encodeURIComponent(rawUrl);

    if (rawUrl.includes('.mpd')) {
      playDash(proxiedUrl, keys);
    } else {
      loadStream(proxiedUrl);
    }

    showToast(`Now playing: ${name}`);
  } catch (e) {
    console.error(e);
    loaderOverlay.style.display = 'none';
    errorOverlay.classList.add('show');
    errorMsg.textContent = 'Failed to load stream';
    errorSub.textContent = e.message || 'Try another channel';
  }
}

function playDash(url, keys) {
  destroyPlayers();
  video.removeAttribute('src'); video.load();
  qualityBtn.textContent = 'DASH';

  dashPlayer = dashjs.MediaPlayer().create();

  const clearkeys = {};
  if (Array.isArray(keys)) {
    keys.forEach(k => {
      const kid = k.kid || k.KID || k.id;
      const key = k.key || k.KEY || k.value;
      if (kid && key) clearkeys[kid] = key;
    });
  } else if (keys && typeof keys === 'object') {
    Object.assign(clearkeys, keys);
  } else if (keys && typeof keys === 'string') {
    keys.split(',').forEach(pair => {
      const parts = pair.trim().split(':');
      if (parts.length === 2) clearkeys[parts[0].trim()] = parts[1].trim();
    });
  }
  const protectionData = Object.keys(clearkeys).length
    ? { "org.w3.clearkey": { "clearkeys": clearkeys } }
    : {};

  dashPlayer.setProtectionData(protectionData);
  dashPlayer.initialize(video, url, true);

  dashPlayer.on(dashjs.MediaPlayer.events.ERROR, function () {
    loaderOverlay.style.display = 'none';
    errorOverlay.classList.add('show');
    errorMsg.textContent = 'Stream error';
    errorSub.textContent = 'Please try another channel';
    destroyPlayers();
  });

  dashPlayer.on(dashjs.MediaPlayer.events.PLAYBACK_PLAYING, function () {
    loaderOverlay.style.display = 'none';
    updatePlayIcon();
  });

  dashPlayer.on(dashjs.MediaPlayer.events.PLAYBACK_PAUSED, function () {
    updatePlayIcon();
  });
}

function loadStream(url) {
  destroyPlayers();
  video.removeAttribute('src'); video.load();
  currentLevel = -1;
  qualityBtn.textContent = 'AUTO';

  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      backBufferLength: 90,
      liveSyncDurationCount: 5,
      liveMaxLatencyDurationCount: 10,
      maxBufferHole: 0.5,
      highBufferWatchdogPeriod: 3,
      nudgeOffset: 0.1,
      nudgeMaxRetry: 6,
      enableSoftwareAES: true,
      manifestLoadingTimeOut: 12000,
      manifestLoadingMaxRetry: 4,
      levelLoadingTimeOut: 12000,
      levelLoadingMaxRetry: 4,
      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 500
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
      const levels = data.levels;
      qualityBtn.onclick = () => cycleQuality(levels);
      video.muted = false; video.volume = 0.8;
      video.play().catch(() => { video.muted = true; video.play().catch(()=>{}); updateMuteIcon(); });
      updatePlayIcon();
      loaderOverlay.style.display = 'none';
    });

    hls.on(Hls.Events.ERROR, function (event, data) {
      if (data.fatal) {
        switch (data.type) {
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad();
            break;
          default:
            loaderOverlay.style.display = 'none';
            errorOverlay.classList.add('show');
            errorMsg.textContent = 'Stream error';
            errorSub.textContent = 'Please try another channel';
            destroyPlayers();
            break;
        }
      } else if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
        if (video.buffered.length > 0) {
          video.currentTime = video.buffered.end(video.buffered.length - 1) - 0.5;
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(() => {});
      loaderOverlay.style.display = 'none';
    }, { once: true });
  }
}

function destroyPlayers() {
  if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  if (dashPlayer) { try { dashPlayer.reset(); } catch(e){} dashPlayer = null; }
}

function cycleQuality(levels) {
  if (!hls || !levels.length) return;
  if (currentLevel === -1) currentLevel = levels.length - 1;
  else if (currentLevel === 0) currentLevel = -1;
  else currentLevel--;
  hls.currentLevel = currentLevel;
  qualityBtn.textContent = currentLevel === -1 ? 'AUTO' : `${levels[currentLevel].height}p`;
}

function updatePlayIcon() {
  const paused = dashPlayer ? dashPlayer.isPaused() : video.paused;
  playIcon.innerHTML = paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
}
function updateMuteIcon() {
  muteIcon.innerHTML = (video.muted || video.volume === 0)
    ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.17v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
    : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
  volumeFill.style.width = (video.muted ? 0 : video.volume * 100) + '%';
}

playBtn.onclick = () => {
  if (dashPlayer) { dashPlayer.isPaused() ? dashPlayer.play() : dashPlayer.pause(); }
  else { video.paused ? video.play() : video.pause(); }
  updatePlayIcon();
};
video.addEventListener('play', updatePlayIcon);
video.addEventListener('pause', updatePlayIcon);
muteBtn.onclick = () => { video.muted = !video.muted; updateMuteIcon(); };
volumeSlider.onclick = e => {
  const r = volumeSlider.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  video.volume = p; video.muted = p === 0; updateMuteIcon();
};
$('retryBtn').onclick = () => { if (lastChannel) playChannel(lastChannel, lastCard); };
fullscreenBtn.onclick = () => {
  const w = $('playerWrapper');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  } else if (w.requestFullscreen) {
    w.requestFullscreen();
  } else if (w.webkitRequestFullscreen) {
    w.webkitRequestFullscreen();
  } else if (video.webkitEnterFullscreen) {
    // iOS Safari: only the <video> element itself supports fullscreen,
    // not a wrapping div — this is the native player chrome fallback.
    video.webkitEnterFullscreen();
  } else {
    showToast('Fullscreen not supported on this browser');
  }
};
fitBtn.onclick = () => {
  isFitCover = !isFitCover;
  video.style.objectFit = isFitCover ? 'cover' : 'contain';
  fitBtn.classList.toggle('active', isFitCover);
  showToast(isFitCover ? 'Fit mode: cover screen' : 'Fit mode: contain');
};
video.addEventListener('click', () => {
  if (dashPlayer) { dashPlayer.isPaused() ? dashPlayer.play() : dashPlayer.pause(); }
  else { video.paused ? video.play() : video.pause(); }
  updatePlayIcon();
});

let searchDebounce = null;
searchInput.addEventListener('input', e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { renderChannels(currentChannels); return; }
    renderChannels(currentChannels.filter(c => (c.name || c.title || '').toLowerCase().includes(q)));
  }, 150);
});

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 3000);
}

video.volume = 0.8;
updateMuteIcon();
updatePlayIcon();
loadCategories();
</script>

</body>
</html>
