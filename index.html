<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screenify 1.8.0 Beta — Downloads (Phone · TV · Low-end)</title>
<meta name="description" content="Screenify 1.8.0 beta — 100% free, no ads. 6 entertainment servers, rebased Live TV, phone-as-remote. Download for Phone, TV or low-end devices.">
<link rel="icon" href="https://screenifyplus.online/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;500;600;700&family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0A0A; --bg2:#171010; --bg3:#120C0C;
    --line:#2E2121; --text:#F5EDEB; --muted:#A39694;
    --accent:#FF4438; --accent-hi:#FF6A5E; --accent-dim:rgba(255,68,56,.08);
    --mono:'JetBrains Mono',monospace; --sans:'Archivo',sans-serif;
  }
  html[lang="ar"]{
    --sans:'Cairo','Archivo',sans-serif;
    --mono:'JetBrains Mono','Cairo',monospace;
  }
  html[lang="ar"] *{letter-spacing:0 !important}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;color-scheme:dark}
  body{
    background:var(--bg);color:var(--text);
    font:500 16px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(rgba(245,237,235,.035) 1px,transparent 1.2px);
    background-size:26px 26px;
  }
  ::selection{background:var(--accent);color:#120B0B}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#3A2826;border:2px solid var(--bg)}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  img{display:block}
  .ic{width:18px;height:18px;flex:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px}
  .sl{color:var(--accent);opacity:.8}
  section{scroll-margin-top:90px}

  /* ---------- reveal ---------- */
  .rv{opacity:0;transform:translateY(16px);
      transition:opacity .7s ease var(--d,0s),transform .7s cubic-bezier(.22,.8,.3,1) var(--d,0s)}
  .rv.on{opacity:1;transform:none}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(14,10,10,.86);
         backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:24px;height:64px}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;
         font:800 15px var(--sans);letter-spacing:.14em}
  .logo-img{width:26px;height:26px;object-fit:contain}
  .logo-fb{display:none;width:26px;height:26px}
  .brand small{font:600 9.5px var(--mono);letter-spacing:.2em;color:var(--accent);
               border:1px solid rgba(255,68,56,.35);padding:3px 7px;border-radius:999px}
  nav{display:flex;gap:24px}
  nav a{font:500 11px var(--mono);letter-spacing:.16em;color:var(--muted);
        text-decoration:none;transition:color .2s}
  nav a:hover{color:var(--accent)}
  .top-meta{margin-inline-start:auto;display:flex;align-items:center;gap:16px}
  .lang{display:flex;border:1px solid var(--line)}
  .lang-btn{padding:8px 11px;font:700 10.5px var(--mono);color:var(--muted);
            transition:color .2s,background .2s}
  .lang-btn + .lang-btn{border-inline-start:1px solid var(--line)}
  .lang-btn:hover{color:var(--text)}
  .lang-btn.on{color:var(--accent);background:var(--accent-dim)}
  .live{display:flex;align-items:center;gap:8px;font:600 10.5px var(--mono);
        letter-spacing:.18em;color:var(--muted)}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--accent);
          animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,68,56,.45)}
                   70%{box-shadow:0 0 0 7px rgba(255,68,56,0)}
                   100%{box-shadow:0 0 0 0 rgba(255,68,56,0)}}
  .clock{font:500 12px var(--mono);color:var(--muted);letter-spacing:.08em}
  @media(max-width:900px){nav{display:none}}
  @media(max-width:760px){.clock{display:none}}
  @media(max-width:620px){.live{display:none}}
  @media(max-width:400px){.lang-btn{padding:8px 8px}}

  /* ---------- hero ---------- */
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;
        align-items:center;padding:64px 24px 56px}
  .eyebrow{font:600 11px var(--mono);letter-spacing:.22em;color:var(--muted)}
  h1{font:900 clamp(2.5rem,5.6vw,4.4rem)/1.04 var(--sans);
     letter-spacing:-.025em;text-transform:uppercase;margin:18px 0 22px}
  html[lang="ar"] h1{line-height:1.18}
  h1 em{font-style:italic;color:var(--accent)}
  html[lang="ar"] h1 em{font-style:normal}
  .lede{color:var(--muted);font-size:16.5px;max-width:36rem}
  .lede b{color:var(--text);font-weight:600}
  .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}
  .meta-line{margin-top:32px;font:600 11px var(--mono);letter-spacing:.18em;color:var(--muted)}

  .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;
       font:700 14.5px var(--sans);letter-spacing:.03em;text-decoration:none;
       border:1px solid transparent;transition:transform .18s,background .18s,border-color .18s,color .18s}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn-solid{background:var(--accent);color:#150A0A}
  .btn-solid:hover{background:var(--accent-hi);transform:translateY(-2px)}
  .btn-ghost{border-color:var(--line);color:var(--text)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- phone mockup ---------- */
  .hero-fig{position:relative;display:flex;flex-direction:column;align-items:center;
            justify-content:center;perspective:1200px;padding:30px 34px}
  .phone{width:min(300px,74vw);aspect-ratio:9/19.2;border-radius:46px;
         background:#070505;border:1px solid #3A2826;padding:11px;position:relative;
         box-shadow:0 34px 90px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
         transform-style:preserve-3d;will-change:transform}
  .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#000;position:relative}
  .screen img{width:100%;height:100%;object-fit:cover;object-position:top center}
  .punch{position:absolute;top:13px;left:50%;transform:translateX(-50%);
         width:12px;height:12px;border-radius:50%;background:#000;
         border:2px solid #201616;z-index:2}
  .side-btn{position:absolute;background:#4A3432;border-radius:2px}
  .sb-power{right:-3.5px;top:27%;width:3.5px;height:66px}
  .sb-vol{left:-3.5px;top:22%;width:3.5px;height:44px}
  .sb-vol2{left:-3.5px;top:calc(22% + 54px);width:3.5px;height:44px}
  .fig-cap{margin-top:20px;font:500 10.5px var(--mono);letter-spacing:.16em;
           color:var(--muted);text-align:center}
  .chip{position:absolute;display:flex;align-items:center;gap:9px;white-space:nowrap;
        background:rgba(23,16,16,.92);border:1px solid var(--line);padding:10px 14px;
        font:600 10px var(--mono);letter-spacing:.14em;color:var(--muted);
        backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:3;
        will-change:transform}
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .chip b{color:var(--text);font-weight:700}
  .chips-float .c1{top:13%;left:-14px}
  .chips-float .c2{top:40%;right:-20px}
  .chips-float .c3{bottom:26%;left:-26px}
  .chips-float .c4{bottom:8%;right:-8px}
  .chips-float .c5{top:-6px;left:32%}
  .chips-row{display:none;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
  .chips-row .chip{position:static}
  @media(max-width:960px){
    .hero{grid-template-columns:1fr;gap:36px;padding-top:48px}
    .chips-float{display:none}
    .chips-row{display:flex}
  }

  /* ---------- marquee ---------- */
  .marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
           padding:11px 0;direction:ltr}
  .mq-track{display:flex;width:max-content;white-space:nowrap;animation:mq 28s linear infinite}
  .marquee:hover .mq-track{animation-play-state:paused}
  .mq-track span{font:600 11px var(--mono);letter-spacing:.2em;color:var(--muted)}
  .mq-track i{font-style:normal;color:var(--accent)}
  @keyframes mq{to{transform:translateX(-50%)}}

  /* ---------- telegram banner ---------- */
  .tg-band{border-bottom:1px solid var(--line);
           background:linear-gradient(120deg,#151011 0%,#1C100E 55%,#150E0D 100%);
           position:relative;overflow:hidden}
  .tg-band::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(560px 220px at 78% 50%, rgba(255,68,56,.14), transparent 70%)}
  .tg-inner{display:flex;align-items:center;justify-content:space-between;gap:30px;
            flex-wrap:wrap;max-width:1140px;margin:0 auto;padding:58px 24px;position:relative;
            text-decoration:none;color:inherit}
  .tg-left{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .tg-ic{width:86px;height:86px;border:1px solid rgba(255,68,56,.45);flex:none;
         display:grid;place-items:center;color:var(--accent);transition:.25s}
  .tg-ic svg{width:38px;height:38px}
  .tg-band:hover .tg-ic{background:var(--accent-dim);transform:translateY(-4px)}
  .tg-h2{font:900 clamp(1.9rem,4.6vw,3.3rem)/1.05 var(--sans);letter-spacing:-.02em;
         text-transform:uppercase}
  html[lang="ar"] .tg-h2{text-transform:none;letter-spacing:0}
  .tg-p{margin-top:8px;color:var(--muted);font-size:15.5px;max-width:46ch}
  .tg-sub{margin-top:10px;font:700 12px var(--mono);letter-spacing:.16em;color:var(--accent)}
  .tg-btn{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--accent);
          color:var(--accent);padding:18px 26px;font:700 14px var(--mono);letter-spacing:.1em;
          transition:.22s;flex:none;white-space:nowrap}
  .tg-band:hover .tg-btn{background:var(--accent);color:#150A0A;transform:translateY(-3px);
          box-shadow:0 14px 34px rgba(255,68,56,.28)}
  .tg-btn .ic{transition:transform .2s}
  .tg-band:hover .tg-btn .ic{transform:translate(3px,-3px)}
  .tg-btn:focus-visible,.tg-inner:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  @media(max-width:760px){.tg-inner{flex-direction:column;align-items:flex-start;padding:44px 24px}
                          .tg-btn{width:100%;justify-content:center}}

  /* ---------- interactive matrix band ---------- */
  .matrix-band{border-bottom:1px solid var(--line);
               background:var(--bg3);position:relative;overflow:hidden}
  .matrix-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
               flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:16px 24px 0;
               font:600 10px var(--mono);letter-spacing:.18em;color:var(--muted)}
  .matrix-head .m-hint{color:var(--accent);opacity:.85}
  .matrix-stage{position:relative;height:clamp(170px,26vw,300px)}
  #matrix{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  @media(max-width:560px){.matrix-head{font-size:9px;padding-top:12px}}

  /* ---------- sections ---------- */
  .section{padding-top:92px}
  .sec-head{display:flex;align-items:center;gap:18px;margin-bottom:38px}
  .sec-idx{font:700 13px var(--mono);color:var(--accent);letter-spacing:.1em}
  .sec-head h2{font:800 clamp(1.65rem,3.4vw,2.35rem)/1.1 var(--sans);letter-spacing:-.02em}
  .rule{flex:1;height:1px;background:var(--line)}
  .sec-tip{font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--muted)}
  @media(max-width:640px){.sec-tip{display:none}}

  /* ---------- downloads ---------- */
  .dl-grid{display:grid;grid-template-columns:5fr 7fr;gap:20px;align-items:start}
  .dl-list{border:1px solid var(--line);background:var(--bg2)}
  .dev{width:100%;text-align:start;display:grid;grid-template-columns:auto auto 1fr auto;
       gap:18px;align-items:center;padding:23px 20px;transition:background .2s,box-shadow .2s;
       border-bottom:1px solid var(--line)}
  .dev:last-child{border-bottom:0}
  .dev:hover{background:rgba(245,237,235,.03)}
  .dev:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .dev-num{font:600 12px var(--mono);color:var(--muted);letter-spacing:.08em}
  .dev-ic{color:var(--muted);display:flex;transition:color .2s}
  .dev-ic .ic{width:22px;height:22px}
  .dev-txt b{display:block;font:700 17px var(--sans);letter-spacing:.01em}
  .dev-txt small{display:block;margin-top:3px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--muted)}
  .dev-arrow{color:var(--muted);display:flex;transition:transform .2s,color .2s}
  .dev.sel{background:var(--accent-dim);box-shadow:inset 3px 0 0 var(--accent)}
  .dev.sel .dev-num,.dev.sel .dev-ic,.dev.sel .dev-arrow{color:var(--accent)}
  .dev.sel .dev-arrow{transform:translate(2px,-2px)}
  [dir="rtl"] .dev.sel{box-shadow:inset -3px 0 0 var(--accent)}
  [dir="rtl"] .dev.sel .dev-arrow{transform:translate(-2px,-2px)}

  .dl-panel{position:sticky;top:92px;border:1px solid var(--line);background:var(--bg2);padding:26px}
  .panel-in.in{animation:pIn .38s cubic-bezier(.22,.8,.3,1)}
  @keyframes pIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .p-top{display:flex;gap:16px;align-items:center;margin-bottom:18px}
  .p-ic{width:48px;height:48px;border:1px solid var(--line);background:var(--bg3);
        display:grid;place-items:center;color:var(--accent);flex:none}
  .p-ic .ic{width:22px;height:22px}
  .p-name{font:800 24px/1.1 var(--sans)}
  .p-tag{margin-top:5px;font:500 10.5px var(--mono);letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
  .p-desc{color:var(--muted);font-size:15px;margin-bottom:20px}
  .p-meta{margin-bottom:20px}
  .pm{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
      padding:9px 2px;border-bottom:1px dashed var(--line)}
  .pm:last-child{border-bottom:0}
  .pm span{font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--muted)}
  .pm b{font:600 12.5px var(--mono);text-align:end;word-break:break-all}
  .key-block{border:1px solid var(--line);background:var(--bg3);margin-bottom:20px}
  .key-head{display:flex;justify-content:space-between;gap:10px;padding:10px 15px;
            border-bottom:1px solid var(--line);
            font:600 10px var(--mono);letter-spacing:.16em;color:var(--muted)}
  .key-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px}
  .key{font:700 clamp(26px,3vw,32px) var(--mono);letter-spacing:.14em;color:var(--accent);
       cursor:pointer;user-select:all}
  .copy-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);
            padding:10px 14px;font:600 11px var(--mono);letter-spacing:.12em;transition:.2s;flex:none}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
  .copy-btn .ic{width:14px;height:14px}
  .btn-big{width:100%;justify-content:center;padding:17px 20px;font-size:15.5px;letter-spacing:.06em}
  .p-host{margin-top:13px;text-align:center;font:500 10px var(--mono);letter-spacing:.18em;color:var(--muted)}
  @media(max-width:920px){.dl-grid{grid-template-columns:1fr}.dl-panel{position:static}}

  /* ---------- quick keys ---------- */
  .quick{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--bg2);margin-top:18px}
  .q-label{display:flex;align-items:center;padding:15px 18px;
           font:600 10.5px var(--mono);letter-spacing:.2em;color:var(--muted)}
  .q-key{display:flex;align-items:center;gap:13px;padding:15px 18px;
         border-inline-start:1px solid var(--line);flex:1;min-width:190px;justify-content:space-between;
         transition:background .2s}
  .q-key:hover{background:var(--accent-dim)}
  .q-key b{font:700 11px var(--mono);letter-spacing:.14em;color:var(--muted)}
  .q-key code{font:700 15px var(--mono);letter-spacing:.1em;transition:color .2s}
  .q-key:hover code{color:var(--accent)}
  .q-key .ic{width:13px;height:13px;color:var(--muted)}
  @media(max-width:760px){.q-label{width:100%;border-bottom:1px solid var(--line)}
                          .q-key+.q-key{border-inline-start:0;border-top:1px solid var(--line)}}

  /* ---------- what's new ---------- */
  .notes{list-style:none}
  .note{display:grid;grid-template-columns:56px 1fr;gap:22px;padding:30px 0;border-top:1px solid var(--line)}
  .note-ic{width:50px;height:50px;border:1px solid var(--line);background:var(--bg2);
           display:grid;place-items:center;color:var(--muted)}
  .note-ic .ic{width:22px;height:22px}
  .note h3{font:700 19px var(--sans)}
  .note p{color:var(--muted);font-size:15px;margin-top:7px;max-width:62ch}
  .tag{display:inline-block;margin-bottom:11px;font:700 10px var(--mono);letter-spacing:.16em;
       color:var(--accent);border:1px solid rgba(255,68,56,.4);padding:4px 9px}
  .note-hl{background:var(--accent-dim);border:1px solid rgba(255,68,56,.28);
           box-shadow:inset 3px 0 0 var(--accent);padding:26px;margin-top:26px}
  .note-hl .note-ic{color:var(--accent);border-color:rgba(255,68,56,.35);background:var(--bg3)}
  [dir="rtl"] .note-hl{box-shadow:inset -3px 0 0 var(--accent)}
  @media(max-width:560px){.note{grid-template-columns:1fr}.note-ic{display:none}
                          .note-hl{padding:22px}}

  /* ---------- steps ---------- */
  .steps{list-style:none}
  .steps li{display:grid;grid-template-columns:110px 1fr;gap:26px;
            padding:36px 0;border-top:1px solid var(--line)}
  .step-num{font:800 clamp(2.1rem,4.4vw,3rem)/1 var(--sans);color:transparent;
            -webkit-text-stroke:1.5px var(--accent)}
  .steps h3{font:700 19px var(--sans);margin-bottom:8px}
  .steps p{color:var(--muted);font-size:15px;max-width:56ch}
  @media(max-width:560px){.steps li{grid-template-columns:64px 1fr;gap:16px}}

  /* ---------- footer ---------- */
  footer{margin-top:100px;border-top:1px solid var(--line);padding:42px 0 58px}
  .f-brand{display:flex;align-items:center;gap:10px;font:800 14px var(--sans);letter-spacing:.14em}
  .f-brand img{width:22px;height:22px;object-fit:contain}
  .f-brand span{font:600 9.5px var(--mono);letter-spacing:.2em;color:var(--muted)}
  .f-note{margin-top:16px;color:var(--muted);font-size:13.5px;max-width:52ch}
  .f-meta{margin-top:14px;font:600 10.5px var(--mono);letter-spacing:.18em;color:var(--muted)}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:28px;z-index:99;display:flex;align-items:center;gap:10px;
         background:#1B1010;border:1px solid var(--accent);padding:13px 19px;
         font:600 13px var(--mono);letter-spacing:.04em;color:var(--text);
         transform:translate(-50%,16px);opacity:0;pointer-events:none;
         transition:transform .3s cubic-bezier(.22,.8,.3,1),opacity .3s}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .toast .ic{width:15px;height:15px;color:var(--accent)}

  @media (prefers-reduced-motion:reduce){
    .rv{transition:none;opacity:1;transform:none}
    .mq-track{animation:none}
    .live i{animation:none}
    .tg-ic,.tg-btn{transition:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<header>
  <div class="wrap top-in">
    <a class="brand" href="#top">
      <img class="logo-img" src="https://screenifyplus.online/logo.png" alt="Screenify logo"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <svg class="logo-fb" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="1.5" width="17" height="17" stroke="#FF4438" stroke-width="2"/><rect x="6" y="6" width="8" height="8" fill="#FF4438"/></svg>
      SCREENIFY <small>1.8.0-BETA</small>
    </a>
    <nav>
      <a href="#downloads" data-i18n="nav_dl"></a>
      <a href="#whatsnew" data-i18n="nav_new"></a>
      <a href="#install" data-i18n="nav_install"></a>
    </nav>
    <div class="top-meta">
      <div class="lang" role="group" aria-label="Language">
        <button class="lang-btn on" data-lang="en" title="English">EN</button>
        <button class="lang-btn" data-lang="fr" title="Français">FR</button>
        <button class="lang-btn" data-lang="ar" title="العربية">ع</button>

      cell = Math.min(W/(cols+pad*2), H/(rows+pad*2));
      const ox=(W-cols*cell)/2, oy=(H-rows*cell)/2;
      dots=[]; GRID=[];
      let cx=0;
      for(const ch of '1.8.0'){
        const g=FONT[ch];
        for(let y=0;y<7;y++) for(let x=0;x<5;x++){
          const px=ox+(cx+x+.5)*cell, py=oy+(y+.5)*cell;
          GRID.push({x:px,y:py});
          if(g[y][x]==='#') dots.push({hx:px,hy:py,x:px,y:py,vx:0,vy:0,ph:Math.random()*6.28});
        }
        cx+=6;
      }
    }
    function pointerPos(t){
      if(mouse.active && performance.now()-mouse.last < 2500) return {x:mouse.x, y:mouse.y};
      const t2 = t*0.001;
      return { x: W/2 + Math.cos(t2*0.7)*W*0.33, y: H/2 + Math.sin(t2*1.1)*H*0.28 };
    }
    function drawStatic(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='rgba(245,237,235,.05)';
      GRID.forEach(g=>ctx.fillRect(g.x-.75,g.y-.75,1.5,1.5));
      ctx.fillStyle='rgba(255,68,56,.9)';
      dots.forEach(d=>{ctx.beginPath();ctx.arc(d.x,d.y,cell*.3,0,7);ctx.fill();});
    }
    function frame(t){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='rgba(245,237,235,.05)';
      GRID.forEach(g=>ctx.fillRect(g.x-.75,g.y-.75,1.5,1.5));
      const p = pointerPos(t);
      const scanX = -cell*2 + ((t % 5200)/5200)*(W+cell*4);
      for(const d of dots){
        d.vx += (d.hx-d.x)*0.085; d.vy += (d.hy-d.y)*0.085;
        const dx=d.x-p.x, dy=d.y-p.y, dist=Math.hypot(dx,dy), R=cell*4.5;
        if(dist<R && dist>0.01){ const f=(1-dist/R)*2.1; d.vx+=dx/dist*f; d.vy+=dy/dist*f; }
        d.vx*=0.86; d.vy*=0.86; d.x+=d.vx; d.y+=d.vy;
        const sd=Math.abs(d.x-scanX);
        const s = sd<cell*1.4 ? 1-sd/(cell*1.4) : 0;
        const speed=Math.hypot(d.vx,d.vy);
        const ex=Math.min(1, s + Math.min(1, speed*0.14));
        const rad = cell*0.3*(0.82+0.18*Math.sin(t*0.0023+d.ph)) + s*cell*0.18 + Math.min(1,speed*0.15)*cell*0.1;
        ctx.fillStyle = `rgba(255,${Math.round(68+122*ex)},${Math.round(56+124*ex)},${(0.62+0.38*ex).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(d.x,d.y,rad,0,7); ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    cv.addEventListener('pointermove', e=>{
      const r = cv.getBoundingClientRect();
      mouse.x = e.clientX-r.left; mouse.y = e.clientY-r.top;
      mouse.active = true; mouse.last = performance.now();
    });
    cv.addEventListener('pointerleave', ()=>{ mouse.active=false; });
    let rz;
    addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ build(); if(RM) drawStatic(); },150); });
    build();
    if(RM) drawStatic(); else requestAnimationFrame(frame);
  })();

  /* ================= boot ================= */
  let saved = 'en';
  try{ saved = localStorage.getItem('screenify_lang') || 'en'; }catch(e){}
  setLang(T[saved] ? saved : 'en');
</script>
