<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCREENIFY + | Image AI</title>
    
    <meta name="description" content="Screenify+ Image AI is a modern platform to seamlessly generate images. Experience lightning-fast, high-quality generation in a sleek, ad-free interface.">
    <meta property="og:title" content="SCREENIFY + | Image AI">
    <meta property="og:description" content="Discover instant image generation with Screenify+. Generate stunning visuals accurately and for free.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://screenifyplus.online/logo.png">

    <link rel="icon" type="image/png" sizes="64x64" href="https://screenifyplus.online/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://screenifyplus.online/logo.png">
    <link rel="apple-touch-icon" sizes="512x512" href="https://screenifyplus.online/logo.png">
    <meta name="theme-color" content="#e11d48">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SCREENIFY+">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Screenify+ Image AI",
      "url": "https://screenifyplus.online",
      "applicationCategory": "MultimediaApplication",
      "logo": {
        "@type": "ImageObject",
        "url": "https://screenifyplus.online/logo.png",
        "width": 512,
        "height": 512
      }
    }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: #111113;
            --border: #27272a;
            --accent: #e11d48;
            --accent-hover: #be123c;
            --accent-glow: rgba(225, 29, 72, 0.4);
            --text-main: #ededed;
            --text-dim: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(50px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .animate {
            opacity: 0;
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px 40px;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 15px;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-container {
            width: 95%;
            max-width: 1100px;
            margin: 0 auto 50px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #0d0d0f;
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: rgba(225, 29, 72, 0.1);
            color: var(--accent);
        }

        .translator-layout { display: flex; min-height: 400px; }
        .panel { flex: 1; display: flex; flex-direction: column; padding: 30px; position: relative; }
        .panel.source { border-right: 1px solid var(--border); }

        @media (max-width: 850px) {
            .translator-layout { flex-direction: column; }
            .panel.source { border-right: none; border-bottom: 1px solid var(--border); }
        }

        .selector-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        select, .input-url {
            background: #18181b; color: var(--text-main); border: 1px solid var(--border);
            padding: 12px 20px; border-radius: 12px; font-weight: 500; outline: none; width: 100%;
        }

        textarea {
            width: 100%; flex: 1; background: transparent; color: var(--text-main);
            border: none; font-size: 20px; line-height: 1.6; resize: none; outline: none; min-height: 150px;
        }

        .output-container {
            flex: 1; display: flex; align-items: center; justify-content: center;
            flex-direction: column; text-align: center; min-height: 250px;
        }

        .generated-img { max-width: 100%; max-height: 400px; border-radius: 12px; display: none; border: 1px solid var(--border); }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(225, 29, 72, 0.2); border-left-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: none; }

        .action-bar { padding: 20px 30px; background: #0d0d0f; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); }
        button.translate-btn { background: var(--accent); color: #fff; border: none; padding: 14px 35px; font-weight: 600; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        .history-section { padding: 20px 30px; background: #111113; border-top: 1px solid var(--border); }
        .history-grid { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .history-item { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .history-item:hover { border-color: var(--accent); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; }

        .footer-links { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .footer-links a { color: var(--text-dim); text-decoration: none; font-weight: 600; }
        footer { padding: 40px 20px; text-align: center; color: var(--text-dim); border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <nav class="animate">
        <div class="logo">
            <img src="https://screenifyplus.online/logo.png" alt="Logo" height="35">
            <span class="logo-text">Screenify+ <span style="color: var(--accent)">AI</span></span>
        </div>
    </nav>

    <section class="hero animate">
        <h1>Imagine the World.</h1>
        <p>Experience the next generation of visual creation with Screenify+ AI.</p>
    </section>

    <div class="app-container animate">
        <div class="translator-layout">
            <div class="panel source">
                <div class="tabs">
                    <button class="tab-btn active" id="btnCreate" onclick="switchMode('create')">Create Image</button>
                    <button class="tab-btn" id="btnEdit" onclick="switchMode('edit')">Edit Image</button>
                    <button class="tab-btn" id="btnBlend" onclick="switchMode('blend')">Blend Images</button>
                </div>

                <div class="selector-row" id="selectorRow">
                    <select id="model">
                        <option value="NanoBanana">NanoBanana</option>
                        <option value="NanoBanana2" selected>NanoBanana 2</option>
                        <option value="NanoBananaPro">NanoBanana Pro</option>
                        <option value="gpt2">Screenify GPT Image 2 (Fast & High Quality) </option>
                    </select>
                    <select id="ratio">
                        <option value="16:9">Widescreen (16:9)</option>
                        <option value="1:1">Square (1:1)</option>
                        <option value="9:16">Portrait (9:16)</option>
                    </select>
                </div>

                <div id="editUrlGroup" style="display:none; margin-bottom: 15px;">
                    <input type="text" id="imageLinks" class="input-url" placeholder="Paste Image URL here">
                </div>

                <div id="blendUrlGroup" style="display:none; margin-bottom: 15px;">
                    <input type="text" id="blendImg1" class="input-url" placeholder="First Image URL" style="margin-bottom: 10px;">
                    <input type="text" id="blendImg2" class="input-url" placeholder="Second Image URL">
                </div>

                <textarea id="inputText" placeholder="Describe your image..."></textarea>
                
                <div class="panel-controls" style="display:flex; justify-content:space-between; margin-top:10px;">
                    <button onclick="randomizePrompt()" style="background:none; border:1px solid var(--border); color:var(--accent); padding:8px 12px; border-radius:8px; cursor:pointer;">Surprise Me</button>
                    <button onclick="document.getElementById('inputText').value = ''" style="background:none; border:1px solid var(--border); color:var(--text-dim); padding:8px 12px; border-radius:8px; cursor:pointer;">Clear</button>
                </div>
            </div>

            <div class="panel target">
                <div class="output-container" id="outputContainer">
                    <div class="spinner" id="loadingSpinner"></div>
                    <div id="loadingText" style="display:none; color:var(--accent); margin-top:10px;">Processing...</div>
                    <img id="resultImg" class="generated-img" src="">
                </div>
                <div style="margin-top:15px; text-align:right;">
                    <a href="#" id="downloadBtn" style="display:none; color:var(--text-main); text-decoration:none; font-weight:600; border:1px solid var(--border); padding:8px 15px; border-radius:8px;">Download</a>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <span></span>
            <button class="translate-btn" id="generateBtn" onclick="generateImage()">Generate Image</button>
        </div>

        <div class="history-section" id="historySection" style="display:none;">
            <h3>Recent Generations</h3>
            <div class="history-grid" id="historyGrid"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Screenify+. All rights reserved.</p>
    </footer>

    <div class="modal-overlay" id="clearModal">
        <div class="modal-content">
            <h3>Clear History?</h3>
            <div style="margin-top:20px; display:flex; gap:10px; justify-content:center;">
                <button onclick="closeClearModal()">Cancel</button>
                <button onclick="executeClearHistory()" style="background:var(--accent); color:white; border:none; padding:10px 20px; border-radius:8px;">Clear</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'create';
        let imageHistory = JSON.parse(localStorage.getItem('screenify_history') || '[]');

        window.onload = renderHistory;

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnCreate').classList.toggle('active', mode === 'create');
            document.getElementById('btnEdit').classList.toggle('active', mode === 'edit');
            document.getElementById('btnBlend').classList.toggle('active', mode === 'blend');
            document.getElementById('selectorRow').style.display = mode === 'create' ? 'flex' : 'none';
            document.getElementById('editUrlGroup').style.display = mode === 'edit' ? 'block' : 'none';
            document.getElementById('blendUrlGroup').style.display = mode === 'blend' ? 'block' : 'none';
        }

        function randomizePrompt() {
            const prompts = ["A cyberpunk city in the rain", "A majestic space nebula", "Minimalist Moroccan interior", "Future tech gadgets"];
            document.getElementById('inputText').value = prompts[Math.floor(Math.random() * prompts.length)];
        }

        function renderHistory() {
            const grid = document.getElementById('historyGrid');
            if (imageHistory.length === 0) return;
            document.getElementById('historySection').style.display = 'block';
            grid.innerHTML = '';
            imageHistory.forEach(url => {
                const img = document.createElement('img');
                img.src = url; img.className = 'history-item';
                img.onclick = () => { document.getElementById('resultImg').src = url; document.getElementById('resultImg').style.display = 'block'; };
                grid.appendChild(img);
            });
        }

        async function generateImage() {
            const text = document.getElementById('inputText').value;
            const model = document.getElementById('model').value;
            const btn = document.getElementById('generateBtn');
            
            if (!text) return alert("Enter a prompt");

            btn.disabled = true;
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('loadingText').style.display = 'block';

            try {
                let url = "";
                if (currentMode === 'create' && model === 'gpt2') {
                    // NEW GPT IMAGE 2 PATH
                    const res = await fetch("https://ai2.iliassahnoun23.workers.dev/", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ text: text })
                    });
                    const data = await res.json();
                    url = data.image_url;
                } else if (currentMode === 'edit') {
                    const img = document.getElementById('imageLinks').value;
                    const res = await fetch("https://ia.iliassahnoun23.workers.dev/", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ mode: "edit", img: img, text: text })
                    });
                    const data = await res.json();
                    url = data.image_url;
                } else if (currentMode === 'blend') {
                    const img1 = document.getElementById('blendImg1').value;
                    const img2 = document.getElementById('blendImg2').value;
                    const res = await fetch("https://ia.iliassahnoun23.workers.dev/", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ mode: "blend", img1: img1, img2: img2, text: text })
                    });
                    const data = await res.json();
                    url = data.image_url;
                } else {
                    // Standard Create Path
                    const formData = new FormData();
                    formData.append('text', text);
                    formData.append('model', model);
                    const res = await fetch('https://ai.iliassahnoun23.workers.dev/', { method: 'POST', body: formData });
                    const data = await res.json();
                    url = data.url;
                }

                if (url) {
                    document.getElementById('resultImg').src = url;
                    document.getElementById('resultImg').style.display = 'block';
                    document.getElementById('downloadBtn').href = url;
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                    imageHistory.unshift(url);
                    localStorage.setItem('screenify_history', JSON.stringify(imageHistory.slice(0, 10)));
                    renderHistory();
                }
            } catch (e) { alert("Error: " + e.message); }
            
            btn.disabled = false;
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('loadingText').style.display = 'none';
        }
    </script>
</body>
</html>
