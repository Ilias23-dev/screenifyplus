<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCREENIFY+ MENA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#141414;--bg1:#181818;--bg2:#1f1f1f;--bg3:#282828;--bg4:#333;--red:#E50914;--redG:rgba(229,9,20,.1);--redGlow:rgba(229,9,20,.35);--tx:#e5e5e5;--tx2:#8c8c8c;--tx3:#555;--bdr:rgba(255,255,255,.08);--grn:#46d369;--r:5px;--nav:64px}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;min-height:100vh}

.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}.logo img{height:32px;width:auto;filter:brightness(1.1)}.logo-fb{display:none;font-size:17px;font-weight:900;color:var(--red);letter-spacing:-1px}
.nav-links{display:flex;align-items:center;gap:2px;margin-right:16px}

.nav-right{display:flex;align-items:center;gap:12px;margin-right:auto}

.status-dot{width:6px;height:6px;border-radius:50%;background:var(--tx3);transition:.4s;flex-shrink:0}.status-dot.on{background:var(--grn);box-shadow:0 0 8px rgba(70,211,105,.5)}
.mob-tabs{display:none;padding:12px 16px;gap:8px;justify-content:center;border-bottom:1px solid var(--bdr);background:var(--bg)}

.search-ov{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.96);backdrop-filter:blur(40px);display:none;flex-direction:column}.search-ov.show{display:flex;animation:sIn .2s ease}
@keyframes sIn{from{opacity:0}to{opacity:1}}

.search-ov-body{flex:1;overflow-y:auto;padding:24px 28px}

.search-cat-label{font-size:13px;font-weight:700;color:#fff;margin:24px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px}.search-cat-label:first-child{margin-top:0}.search-cat-label i{color:var(--red);font-size:12px}

.search-more{display:flex;justify-content:center;padding:20px 0}.search-more button{padding:10px 32px;border-radius:4px;border:1px solid var(--bdr);background:var(--bg2);color:var(--tx);font:600 13px/1 'Cairo';cursor:pointer;transition:.2s}.search-more button:hover{border-color:var(--red);color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes cIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.btn-g{height:44px;padding:0 24px;border-radius:4px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:600 14px/1 'Cairo';cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s}.btn-g:hover{background:rgba(255,255,255,.15)}
.btn-fav{height:44px;padding:0 20px;border-radius:4px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:var(--tx2);font:600 13px/1 'Cairo';cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s}.btn-fav:hover{border-color:var(--red);color:var(--red)}.btn-fav.saved{color:var(--red);border-color:rgba(229,9,20,.4);background:var(--redG)}
.rows-wrap{position:relative;z-index:1}
.nflx-row{margin-bottom:4px;opacity:0;transform:translateY(25px);transition:opacity .5s ease,transform .5s ease}.nflx-row.vis{opacity:1;transform:translateY(0)}
.nflx-row-head{display:flex;align-items:center;justify-content:space-between;padding:16px 28px 10px}
.nflx-row-title{font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}.nflx-row-title i{color:var(--red);font-size:14px}
.nflx-row-actions{display:flex;align-items:center;gap:8px}
.see-all-btn{padding:6px 16px;border-radius:3px;border:1px solid var(--bdr);background:0;color:var(--tx2);font:600 11px/1 'Cairo';cursor:pointer;transition:.2s;white-space:nowrap}.see-all-btn:hover{border-color:var(--red);color:var(--red)}

.nflx-scroll{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;padding:4px 28px 16px;scrollbar-width:none}.nflx-scroll::-webkit-scrollbar{display:none}
.rcard{flex:0 0 auto;width:175px;border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;border:2px solid transparent;transition:all .3s ease;background:var(--bg1)}

.rcard-info{padding:8px 9px 10px}.rcard-name{font-size:11px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tx)}.rcard-sub{font-size:9px;color:var(--tx3);margin-top:2px}

.row-error{padding:12px 28px;color:var(--tx3);font-size:12px;display:flex;align-items:center;gap:8px}.row-error i{color:var(--red)}.row-error button{background:0;border:1px solid var(--bdr);color:var(--tx2);padding:4px 12px;border-radius:3px;cursor:pointer;font:600 11px/1 'Cairo';transition:.2s}.row-error button:hover{border-color:var(--red);color:var(--red)}
.sa-top{display:flex;align-items:center;gap:14px;padding:20px 28px;border-bottom:1px solid var(--bdr)}.sa-top h2{font-size:20px;font-weight:900;color:#fff}

.sa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;padding:20px 28px 10px}
.sa-more{display:flex;justify-content:center;padding:20px 0 40px}.sa-more button{padding:10px 32px;border-radius:4px;border:1px solid var(--bdr);background:var(--bg2);color:var(--tx);font:600 13px/1 'Cairo';cursor:pointer;transition:.2s}.sa-more button:hover{border-color:var(--red);color:var(--red)}
.sa-empty{text-align:center;padding:60px 20px;color:var(--tx3);grid-column:1/-1}.sa-empty i{font-size:36px;display:block;margin-bottom:12px;opacity:.2}
.ov{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;display:none}.ov.show{display:block;animation:ovIn .3s ease}@keyframes ovIn{from{opacity:0}to{opacity:1}}
.ov::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}
.ov-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:linear-gradient(180deg,rgba(20,20,20,.98) 80%,transparent)}
.ov-back{display:flex;align-items:center;gap:8px;color:var(--tx2);cursor:pointer;font:600 12px/1 'Cairo';transition:.2s;background:0;border:0;padding:0}.ov-back:hover{color:#fff}
.ov-x{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.2s}.ov-x:hover{background:var(--red)}
.ov-hero{position:relative;width:100%;height:400px;overflow:hidden}.ov-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 15%;filter:brightness(.18) blur(2px)}.ov-hero-grad{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(20,20,20,.2) 40%,transparent 70%)}
.ov-content{max-width:1000px;margin:-180px auto 0;padding:0 28px 100px;position:relative;z-index:2}

.ov-info{flex:1;padding-top:120px}.ov-title{font-size:clamp(22px,3.5vw,38px);font-weight:900;line-height:1.15;margin-bottom:14px;color:#fff}
