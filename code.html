.nav-link.active { color: var(--red); }

.btn-lang:hover { color: var(--red); }
.btn-lang .globe-icon { width: 18px; height: 18px; }
.btn-lang .chev-icon { width: 14px; height: 14px; transition: transform .2s; }
.lang-wrap.open .btn-lang .chev-icon { transform: rotate(180deg); }
.lang-menu { position: absolute; top: calc(100% + 15px); right: 0; background: rgba(14,14,20,0.95); backdrop-filter: var(--glass-blur); border: 1px solid rgba(255,255,255,.15); border-radius: 12px; overflow: hidden; display: none; min-width: 140px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
[dir="rtl"] .lang-menu { right: auto; left: 0; }
.lang-wrap.open .lang-menu { display: block; animation: fadeIn .2s ease; }
.lang-item { padding: 12px 16px; font-size: .9rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .2s; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: left; }
[dir="rtl"] .lang-item { text-align: right; }
.lang-item:hover, .lang-item.on { background: rgba(255,26,46,0.15); color: #fff; }

.hero p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; }

.codes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
.glass-panel { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 20px; overflow: hidden; transition: transform .3s, border-color .3s; }
.glass-panel:hover { border-color: rgba(255,26,46,0.4); transform: translateY(-4px); }

let currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  
  // Update Dropdown UI
  document.querySelectorAll('.lang-item').forEach(el => el.classList.toggle('on', el.dataset.lang === lang));
  document.getElementById('current-lang').textContent = lang.toUpperCase();
  document.getElementById('lang-menu').style.display = 'none';
  document.getElementById('lang-wrap').classList.remove('open');
  
  // Update Static Text
  document.getElementById('t-hero-title').textContent = uiT[lang].title;
  document.getElementById('t-hero-sub').textContent = uiT[lang].sub;
  document.getElementById('t-terms').textContent = uiT[lang].terms;
  document.getElementById('t-contact').textContent = uiT[lang].contact;
  document.getElementById('t-nav-codes').textContent = uiT[lang].navCodes;
  document.getElementById('t-nav-back').textContent = uiT[lang].navBack;
  
  renderGrid();
}

function toggleLangMenu(e) {
  e.stopPropagation();
  document.getElementById('lang-wrap').classList.toggle('open');
}

document.addEventListener('click', function(e) {
  const wrap = document.getElementById('lang-wrap');
  if (wrap && !wrap.contains(e.target)) wrap.classList.remove('open');
});

function copyCode(code) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(() => {
      showToast();
    });
  } else {
    const tempInput = document.createElement('input');
    tempInput.value = code;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand('copy');
    document.body.removeChild(tempInput);
    showToast();
  }
}

function showToast() {
  const t = document.getElementById('toast');
  t.textContent = uiT[currentLang].copied;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2500);
}

function renderGrid() {
  const grid = document.getElementById('codes-grid');
  grid.innerHTML = '';
  
  codeData.forEach(cat => {
    const catTitleStr = cat.title[currentLang];
    
    const card = document.createElement('div');
    card.className = 'glass-panel';
    
    const header = `
      <div class="cat-header">
        <div class="cat-title">${catTitleStr}</div>
        <div class="cat-main-code" onclick="copyCode('${cat.mainCode}')" title="Copy ${cat.mainCode}">${cat.mainCode}</div>
      </div>
    `;
    
    const listHtml = cat.sub.map(s => `
      <div class="code-item" onclick="copyCode('${s.c}')">
        <div class="code-name">${s.t[currentLang]}</div>
        <div class="code-val">${s.c}</div>
      </div>
    `).join('');
    
    card.innerHTML = header + `<div class="code-list">${listHtml}</div>`;
    grid.appendChild(card);
  });
}

setLang('en');
